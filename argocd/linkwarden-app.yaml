apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkwarden
  namespace: argocd
spec:
  destination:
    namespace: linkwarden
    server: https://kubernetes.default.svc
  project: default
  source:
    path: services/linkwarden
    repoURL: https://github.com/vimalmenon/homelab-army.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
