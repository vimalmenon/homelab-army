apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pythia
  namespace: argocd
spec:
  destination:
    namespace: microservices
    server: https://kubernetes.default.svc
  project: default
  source:
    path: services/pythia
    repoURL: https://github.com/vimalmenon/homelab-army.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
