---
# ──────────────────────────────────────────────
# apt-upgrade.yml — Update and upgrade apt packages
# on all cluster nodes
# ──────────────────────────────────────────────

- name: Apt Update & Upgrade
  hosts: k3s_cluster
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
