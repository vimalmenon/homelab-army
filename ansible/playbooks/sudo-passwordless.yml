---
# ──────────────────────────────────────────────
# sudo-passwordless.yml — Enable passwordless sudo
# for homelab and hermes users on all cluster nodes
# ──────────────────────────────────────────────
# Also creates the hermes user and deploys SSH keys
# Run: ansible-playbook -i inventory/hosts.ini playbooks/sudo-passwordless.yml

- name: Enable Passwordless Sudo — k3s Cluster Nodes
  hosts: k3s_cluster
  become: true

  vars:
    ssh_users:
      - homelab
      - hermes
    hermes_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAr/Ssm/nhhiMLf4igDkjm5ZMk4V6tPX2MIBRd1RjW0D hermes@hermes"

  tasks:
    # ── Ensure users exist ──
    - name: Ensure hermes user exists
      ansible.builtin.user:
        name: hermes
        shell: /bin/bash
        create_home: true
        state: present

    - name: Ensure homelab user exists
      ansible.builtin.user:
        name: homelab
        shell: /bin/bash
        create_home: true
        state: present

    # ── Passwordless sudo ──
    - name: Enable passwordless sudo for homelab
      ansible.builtin.copy:
        dest: /etc/sudoers.d/homelab
        content: "homelab ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Enable passwordless sudo for hermes
      ansible.builtin.copy:
        dest: /etc/sudoers.d/hermes
        content: "hermes ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    # ── SSH key deployment ──
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0700"
      loop: "{{ ssh_users }}"

    - name: Deploy hermes SSH key to both users
      ansible.builtin.copy:
        dest: "/home/{{ item }}/.ssh/authorized_keys"
        content: "{{ hermes_pubkey }}\n"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0600"
      loop: "{{ ssh_users }}"

    # ── Verification ──
    - name: Verify sudoers file syntax
      ansible.builtin.command: visudo -c
      changed_when: false
      register: visudo_result
      failed_when: "'parsed OK' not in visudo_result.stdout"
