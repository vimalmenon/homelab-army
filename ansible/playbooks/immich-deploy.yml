---
# ──────────────────────────────────────────────
# immich-deploy.yml — Deploy / Update Immich
# ──────────────────────────────────────────────
# Run: ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml
# Target: homelab03 (runs immich components)
# ──────────────────────────────────────────────
#
# This playbook deploys Immich photo management on homelab03:
#   - PostgreSQL 16 + pgvector on local-path (NVMe)
#   - Immich server + ML via Helm chart
#   - Valkey cache on NFS
#   - Traefik ingress with Authelia auth
#
# Prerequisites:
#   - kubectl + helm on the control node
#   - immich helm repo added
#   - Cloudflare tunnel configured for *.completeautomate.com

- name: Deploy Immich on k3s cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    namespace: immich
    helm_chart_version: 0.12.0
    pg_password: "{{ lookup('password', '/dev/null chars=hexdigits length=32') }}"
    storage_nfs: nfs-client
    storage_local: local-path
    photo_storage_size: 100Gi
    db_storage_size: 10Gi

  tasks:
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Create postgres password secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          type: Opaque
          stringData:
            POSTGRES_USER: immich
            POSTGRES_DB: immich
            POSTGRES_PASSWORD: "{{ pg_password }}"

    - name: Create photo library PVC (NFS)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: immich-library
            namespace: "{{ namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_nfs }}"
            resources:
              requests:
                storage: "{{ photo_storage_size }}"

    - name: Create postgres PVC (local-path NVMe)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_local }}"
            resources:
              requests:
                storage: "{{ db_storage_size }}"

    - name: Deploy postgres StatefulSet with pgvector
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          spec:
            serviceName: immich-postgres
            replicas: 1
            selector:
              matchLabels:
                app: immich-postgres
            template:
              metadata:
                labels:
                  app: immich-postgres
              spec:
                containers:
                - name: postgres
                  image: pgvector/pgvector:pg16
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres
                        key: POSTGRES_USER
                  - name: POSTGRES_DB
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres
                        key: POSTGRES_DB
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres
                        key: POSTGRES_PASSWORD
                  volumeMounts:
                  - mountPath: /var/lib/postgresql/data
                    name: data
                volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: immich-postgres

    - name: Deploy postgres service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          spec:
            ports:
            - port: 5432
            selector:
              app: immich-postgres

    - name: Wait for postgres to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app = immich-postgres
      register: pg_pod
      retries: 30
      delay: 5
      until:
        - pg_pod.resources | length > 0
        - pg_pod.resources[0].status.phase == "Running"

    - name: Ensure pgvector extension is enabled
      kubernetes.core.k8s_exec:
        namespace: "{{ namespace }}"
        pod: "{{ pg_pod.resources[0].metadata.name }}"
        command: psql -U immich -d immich -c "CREATE EXTENSION IF NOT EXISTS vector;"

    - name: Ensure immich helm repo is added
      kubernetes.core.helm_repository:
        name: immich
        repo_url: https://immich-app.github.io/immich-charts

    - name: Deploy Immich via Helm
      kubernetes.core.helm:
        name: immich
        chart_ref: immich/immich
        chart_version: "{{ helm_chart_version }}"
        release_namespace: "{{ namespace }}"
        values:
          immich:
            persistence:
              library:
                existingClaim: immich-library
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME: immich-postgres
                    DB_USERNAME: immich
                    DB_DATABASE_NAME: immich
                    DB_PASSWORD: "{{ pg_password }}"
          server:
            ingress:
              main:
                enabled: false
          machine-learning:
            enabled: true
          valkey:
            enabled: true
            persistence:
              data:
                enabled: true
                type: persistentVolumeClaim
                size: 1Gi
                storageClass: "{{ storage_nfs }}"

    - name: Deploy Traefik ingress with Authelia auth
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: immich
            namespace: "{{ namespace }}"
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: authelia-add-https@kubernetescrd,authelia-authelia-forwardauth@kubernetescrd
          spec:
            ingressClassName: traefik
            rules:
            - host: immich.completeautomate.com
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: immich-server
                      port:
                        number: 2283

    - name: Wait for immich pods to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app.kubernetes.io/instance = immich
      register: immich_pods
      retries: 60
      delay: 10
      until:
        - immich_pods.resources | length > 0
        - immich_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == immich_pods.resources | length

    - name: Create Cloudflare DNS record
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ lookup('env', 'CF_ZONE_ID') }}/dns_records"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
          Content-Type: application/json
        body:
          type: "CNAME"
          name: "immich"
          content: "{{ tunnel_id | default('011a9625-236e-42dc-b716-e5de75390eaa') }}.cfargotunnel.com"
          proxied: true
          ttl: 1
        status_code: 200
      ignore_errors: true
      when: lookup('env', 'CLOUDFLARE_API_TOKEN') | default('', true) | length > 0

    - name: Print summary
      debug:
        msg:
          - "✅ Immich deployed on {{ namespace }} namespace"
          - "📍 Access: https://immich.completeautomate.com"
          - "📸 Photo storage: {{ photo_storage_size }} on NFS"
          - "🗄️  Database: {{ db_storage_size }} on local-path (NVMe)"
          - "🧠 Machine Learning: enabled"
