---
# ──────────────────────────────────────────────
# immich-deploy.yml — Deploy / Update Immich
# ──────────────────────────────────────────────
# Fully dynamic — all values can be overridden via -e flags.
#
# Examples:
#
#   # Default deploy (immich.completeautomate.com on homelab03)
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml
#
#   # Custom hostname and storage
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml \
#     -e hostname=photos.mydomain.com \
#     -e namespace=photos \
#     -e photo_storage=500Gi
#
#   # Minimal — ML disabled, smaller DB
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml \
#     -e machine_learning=false \
#     -e db_storage=5Gi \
#     -e ml_disabled=true
#
#   # Existing install — just update config / restart
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml \
#     -e helm_chart_version=0.13.0 \
#     -e state=present
#
# ──────────────────────────────────────────────
- name: Deploy Immich on k3s cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # ── Core identity ──
    namespace: "{{ namespace | default('immich') }}"
    hostname: "{{ hostname | default('immich.completeautomate.com') }}"
    dns_name: "{{ hostname.split('.')[0] }}"

    # ── Version ──
    helm_chart_version: "{{ helm_chart_version | default('0.12.0') }}"

    # ── Storage ──
    photo_storage: "{{ photo_storage | default('100Gi') }}"
    db_storage: "{{ db_storage | default('10Gi') }}"
    cache_storage: "{{ cache_storage | default('1Gi') }}"
    storage_nfs: "{{ storage_nfs | default('nfs-client') }}"
    storage_local: "{{ storage_local | default('local-path') }}"

    # ── Features ──
    machine_learning: "{{ machine_learning | default(true) | bool }}"
    ml_disabled: "{{ not machine_learning }}"

    # ── Postgres ──
    pg_user: "{{ pg_user | default('immich') }}"
    pg_db: "{{ pg_db | default('immich') }}"
    pg_password: "{{ pg_password | default(lookup('password', '/dev/null chars=hexdigits length=32')) }}"

    # ── Cloudflare ──
    cf_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') | default('', true) }}"
    cf_zone_id: "{{ lookup('env', 'CF_ZONE_ID') | default('', true) }}"
    tunnel_id: "{{ tunnel_id | default('011a9625-236e-42dc-b716-e5de75390eaa') }}"

    # ── Auth ──
    authelia_middleware: "{{ authelia_middleware | default('authelia-add-https@kubernetescrd,authelia-authelia-forwardauth@kubernetescrd') }}"

    # ── Operation ──
    state: "{{ state | default('present') }}"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - hostname is defined
          - hostname | length > 0
        fail_msg: "hostname is required (e.g. -e hostname=photos.mydomain.com)"

    - name: Print configuration
      ansible.builtin.debug:
        msg:
          - "═══ Immich Deploy ═══"
          - "  Hostname:    {{ hostname }}"
          - "  Namespace:   {{ namespace }}"
          - "  Helm Chart:  {{ helm_chart_version }}"
          - "  ML enabled:  {{ machine_learning }}"
          - "  Photo storage: {{ photo_storage }} ({{ storage_nfs }})"
          - "  DB storage:    {{ db_storage }} ({{ storage_local }})"
          - "  Cache storage: {{ cache_storage }} ({{ storage_nfs }})"
          - "  DNS record:  {{ dns_name }} → {{ tunnel_id }}.cfargotunnel.com"
          - "══════════════════════"

    # ── 1. Infrastructure ──
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: "{{ state }}"

    - name: Create postgres password secret
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          type: Opaque
          stringData:
            POSTGRES_USER: "{{ pg_user }}"
            POSTGRES_DB: "{{ pg_db }}"
            POSTGRES_PASSWORD: "{{ pg_password }}"

    - name: Create photo library PVC (NFS)
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: immich-library
            namespace: "{{ namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_nfs }}"
            resources:
              requests:
                storage: "{{ photo_storage }}"

    - name: Create postgres PVC (local-path / fast storage)
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_local }}"
            resources:
              requests:
                storage: "{{ db_storage }}"

    # ── 2. PostgreSQL + pgvector ──
    - name: Deploy postgres StatefulSet with pgvector
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          spec:
            serviceName: immich-postgres
            replicas: 1
            selector:
              matchLabels:
                app: immich-postgres
            template:
              metadata:
                labels:
                  app: immich-postgres
              spec:
                containers:
                - name: postgres
                  image: pgvector/pgvector:pg16
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres
                        key: POSTGRES_USER
                  - name: POSTGRES_DB
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres
                        key: POSTGRES_DB
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgres
                        key: POSTGRES_PASSWORD
                  volumeMounts:
                  - mountPath: /var/lib/postgresql/data
                    name: data
                volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: immich-postgres

    - name: Deploy postgres service
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: immich-postgres
            namespace: "{{ namespace }}"
          spec:
            ports:
            - port: 5432
            selector:
              app: immich-postgres

    - name: Wait for postgres to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app = immich-postgres
      register: pg_pod
      retries: 30
      delay: 5
      until:
        - pg_pod.resources | length > 0
        - pg_pod.resources[0].status.phase == "Running"

    - name: Ensure pgvector extension is enabled
      kubernetes.core.k8s_exec:
        namespace: "{{ namespace }}"
        pod: "{{ pg_pod.resources[0].metadata.name }}"
        command: psql -U {{ pg_user }} -d {{ pg_db }} -c "CREATE EXTENSION IF NOT EXISTS vector;"
      when: state == "present"

    # ── 3. Immich Helm chart ──
    - name: Ensure immich helm repo is added
      kubernetes.core.helm_repository:
        name: immich
        repo_url: https://immich-app.github.io/immich-charts
      when: state == "present"

    - name: Deploy Immich via Helm
      kubernetes.core.helm:
        name: immich
        chart_ref: immich/immich
        chart_version: "{{ helm_chart_version }}"
        release_namespace: "{{ namespace }}"
        state: "{{ state }}"
        values:
          immich:
            persistence:
              library:
                existingClaim: immich-library
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME: immich-postgres
                    DB_USERNAME: "{{ pg_user }}"
                    DB_DATABASE_NAME: "{{ pg_db }}"
                    DB_PASSWORD: "{{ pg_password }}"
          server:
            ingress:
              main:
                enabled: false
          machine-learning:
            enabled: "{{ machine_learning }}"
          valkey:
            enabled: true
            persistence:
              data:
                enabled: true
                type: persistentVolumeClaim
                size: "{{ cache_storage }}"
                storageClass: "{{ storage_nfs }}"
      when: state == "present"

    # ── 4. Ingress ──
    - name: Deploy Traefik ingress with Authelia auth
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: immich
            namespace: "{{ namespace }}"
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: "{{ authelia_middleware }}"
          spec:
            ingressClassName: traefik
            rules:
            - host: "{{ hostname }}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: immich-server
                      port:
                        number: 2283
      when: state == "present"

    # ── 5. Cloudflare DNS ──
    - name: Create Cloudflare DNS record
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_id }}/dns_records"
        method: POST
        headers:
          Authorization: "Bearer {{ cf_token }}"
          Content-Type: application/json
        body:
          type: "CNAME"
          name: "{{ dns_name }}"
          content: "{{ tunnel_id }}.cfargotunnel.com"
          proxied: true
          ttl: 1
        status_code: 200
      ignore_errors: true
      when:
        - state == "present"
        - cf_token | length > 0
        - cf_zone_id | length > 0

    # ── 6. Wait for readiness ──
    - name: Wait for immich pods to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app.kubernetes.io/instance = immich
      register: immich_pods
      retries: 60
      delay: 10
      until:
        - immich_pods.resources | length > 0
        - immich_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == immich_pods.resources | length
      when: state == "present"

    # ── 7. Summary ──
    - name: Print summary
      ansible.builtin.debug:
        msg:
          - "═══ Immich Deploy Complete ═══"
          - "  Status:    ✅ {{ state | capitalize }}"
          - "  Namespace: {{ namespace }}"
          - "  Access:    https://{{ hostname }}"
          - "  Storage:"
          - "    📸 Photos:  {{ photo_storage }} ({{ storage_nfs }})"
          - "    🗄️  DB:      {{ db_storage }} ({{ storage_local }})"
          - "    ⚡ Cache:   {{ cache_storage }} ({{ storage_nfs }})"
          - "  🧠 ML enabled: {{ machine_learning }}"
          - "  🌐 CF Tunnel: {{ 'Yes' if cf_token | length > 0 else 'No (manual DNS needed)' }}"
          - "═══════════════════════════════"
      when: state == "present"
