---
# ──────────────────────────────────────────────
# immich-deploy.yml — Deploy / Update Immich
# ──────────────────────────────────────────────
# Fully dynamic multi-instance playbook.
# Run once per hostname — each creates its own
# isolated namespace and resources.
#
# Examples:
#
#   # Default
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml
#
#   # Multiple instances — just change hostname
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml \
#     -e hostname=photos.example.com
#
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml \
#     -e hostname=family.example.com \
#     -e photo_storage=500Gi \
#     -e machine_learning=false
#
#   # Tear down
#   ansible-playbook -i inventory/hosts.ini playbooks/immich-deploy.yml \
#     -e hostname=photos.example.com -e state=absent
#
# ──────────────────────────────────────────────
- name: Deploy Immich on k3s cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # ── Identity — change per instance ──
    hostname: "{{ hostname | default('immich.completeautomate.com') }}"
    namespace: "{{ namespace | default(hostname.split('.')[0]) }}"
    label: "{{ hostname.split('.')[0] }}"

    # ── Version ──
    helm_chart_version: "{{ helm_chart_version | default('0.12.0') }}"

    # ── Storage ──
    photo_storage: "{{ photo_storage | default('100Gi') }}"
    db_storage: "{{ db_storage | default('10Gi') }}"
    cache_storage: "{{ cache_storage | default('1Gi') }}"
    storage_nfs: "{{ storage_nfs | default('nfs-client') }}"
    storage_local: "{{ storage_local | default('local-path') }}"

    # ── Features ──
    machine_learning: "{{ machine_learning | default(true) | bool }}"

    # ── Postgres ──
    pg_user: "{{ pg_user | default('immich') }}"
    pg_db: "{{ pg_db | default('immich') }}"
    pg_password: "{{ pg_password | default(lookup('password', '/dev/null chars=hexdigits length=32')) }}"

    # ── Cloudflare ──
    cf_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') | default('', true) }}"
    cf_zone_id: "{{ lookup('env', 'CF_ZONE_ID') | default('', true) }}"
    tunnel_id: "{{ tunnel_id | default('011a9625-236e-42dc-b716-e5de75390eaa') }}"

    # ── Auth ──
    authelia_middleware: "{{ authelia_middleware | default('authelia-add-https@kubernetescrd,authelia-authelia-forwardauth@kubernetescrd') }}"

    # ── Operation ──
    state: "{{ state | default('present') }}"

    # ── Derived resource names (instance-isolated) ──
    _sts: "{{ label }}-postgres"
    _svc: "{{ label }}-postgres"
    _secret: "{{ label }}-postgres"
    _library_pvc: "{{ label }}-library"
    _db_pvc: "{{ label }}-postgres"
    _ingress: "{{ label }}"
    _helm_release: "{{ label }}"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - hostname is defined
          - hostname | length > 0
          - hostname | regex_search('\.')
        fail_msg: "hostname must be a FQDN (e.g. -e hostname=photos.example.com)"

    - name: Print configuration
      ansible.builtin.debug:
        msg:
          - "═══ Immich Deploy ═══"
          - "  Instance:    {{ label }}"
          - "  Hostname:    {{ hostname }}"
          - "  Namespace:   {{ namespace }}"
          - "  Helm Chart:  {{ helm_chart_version }}"
          - "  ML enabled:  {{ machine_learning }}"
          - "  Photo: {{ photo_storage }} ({{ storage_nfs }})"
          - "  DB:    {{ db_storage }} ({{ storage_local }})"
          - "  Cache: {{ cache_storage }} ({{ storage_nfs }})"
          - "  DNS:   {{ hostname }} → {{ tunnel_id }}.cfargotunnel.com"
          - "══════════════════════"

    # ── 1. Namespace ──
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: "{{ state }}"

    # ── 2. Secrets ──
    - name: Create postgres secret
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ _secret }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich
          type: Opaque
          stringData:
            POSTGRES_USER: "{{ pg_user }}"
            POSTGRES_DB: "{{ pg_db }}"
            POSTGRES_PASSWORD: "{{ pg_password }}"

    # ── 3. PVCs ──
    - name: Create photo library PVC
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ _library_pvc }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_nfs }}"
            resources:
              requests:
                storage: "{{ photo_storage }}"

    - name: Create postgres PVC
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ _db_pvc }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_local }}"
            resources:
              requests:
                storage: "{{ db_storage }}"

    # ── 4. PostgreSQL ──
    - name: Deploy postgres StatefulSet
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: "{{ _sts }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich
          spec:
            serviceName: "{{ _svc }}"
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/instance: "{{ label }}"
                app.kubernetes.io/component: immich-postgres
            template:
              metadata:
                labels:
                  app.kubernetes.io/instance: "{{ label }}"
                  app.kubernetes.io/component: immich-postgres
              spec:
                containers:
                - name: postgres
                  image: pgvector/pgvector:pg16
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: "{{ _secret }}"
                        key: POSTGRES_USER
                  - name: POSTGRES_DB
                    valueFrom:
                      secretKeyRef:
                        name: "{{ _secret }}"
                        key: POSTGRES_DB
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ _secret }}"
                        key: POSTGRES_PASSWORD
                  volumeMounts:
                  - mountPath: /var/lib/postgresql/data
                    name: data
                volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: "{{ _db_pvc }}"

    - name: Deploy postgres service
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ _svc }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich
          spec:
            ports:
            - port: 5432
            selector:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich-postgres

    - name: Wait for postgres to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app.kubernetes.io/instance = {{ label }}
          - app.kubernetes.io/component = immich-postgres
      register: pg_pod
      retries: 30
      delay: 5
      until:
        - pg_pod.resources | length > 0
        - pg_pod.resources[0].status.phase == "Running"
      when: state == "present"

    - name: Enable pgvector extension
      kubernetes.core.k8s_exec:
        namespace: "{{ namespace }}"
        pod: "{{ pg_pod.resources[0].metadata.name }}"
        command: psql -U {{ pg_user }} -d {{ pg_db }} -c "CREATE EXTENSION IF NOT EXISTS vector;"
      when: state == "present"

    # ── 5. Immich Helm chart ──
    - name: Ensure immich helm repo is added
      kubernetes.core.helm_repository:
        name: immich
        repo_url: https://immich-app.github.io/immich-charts
      when: state == "present"

    - name: Deploy Immich via Helm
      kubernetes.core.helm:
        name: "{{ _helm_release }}"
        chart_ref: immich/immich
        chart_version: "{{ helm_chart_version }}"
        release_namespace: "{{ namespace }}"
        state: "{{ state }}"
        values:
          immich:
            persistence:
              library:
                existingClaim: "{{ _library_pvc }}"
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME: "{{ _svc }}"
                    DB_USERNAME: "{{ pg_user }}"
                    DB_DATABASE_NAME: "{{ pg_db }}"
                    DB_PASSWORD: "{{ pg_password }}"
          server:
            ingress:
              main:
                enabled: false
          machine-learning:
            enabled: "{{ machine_learning }}"
          valkey:
            enabled: true
            persistence:
              data:
                enabled: true
                type: persistentVolumeClaim
                size: "{{ cache_storage }}"
                storageClass: "{{ storage_nfs }}"

    # ── 6. Ingress ──
    - name: Deploy Traefik ingress
      kubernetes.core.k8s:
        state: "{{ state }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ _ingress }}"
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/instance: "{{ label }}"
              app.kubernetes.io/component: immich
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: "{{ authelia_middleware }}"
          spec:
            ingressClassName: traefik
            rules:
            - host: "{{ hostname }}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ _helm_release }}-server"
                      port:
                        number: 2283
      when: state == "present"

    # ── 7. Cloudflare DNS ──
    - name: Create Cloudflare DNS record
      uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_id }}/dns_records"
        method: POST
        headers:
          Authorization: "Bearer {{ cf_token }}"
          Content-Type: application/json
        body:
          type: "CNAME"
          name: "{{ label }}"
          content: "{{ tunnel_id }}.cfargotunnel.com"
          proxied: true
          ttl: 1
        status_code: 200
      ignore_errors: true
      when:
        - state == "present"
        - cf_token | length > 0
        - cf_zone_id | length > 0

    # ── 8. Wait ──
    - name: Wait for immich pods to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app.kubernetes.io/instance = {{ _helm_release }}
      register: immich_pods
      retries: 60
      delay: 10
      until:
        - immich_pods.resources | length > 0
        - immich_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == immich_pods.resources | length
      when: state == "present"

    # ── 9. Summary ──
    - name: Print summary
      ansible.builtin.debug:
        msg:
          - "═══ Immich Complete ═══"
          - "  Instance:  {{ label }}"
          - "  Action:    {{ state | capitalize }}"
          - "  Namespace: {{ namespace }}"
          - "  Access:    https://{{ hostname }}"
          - "  📸 Photos:  {{ photo_storage }} ({{ storage_nfs }})"
          - "  🗄️  DB:      {{ db_storage }} ({{ storage_local }})"
          - "  ⚡ Cache:   {{ cache_storage }} ({{ storage_nfs }})"
          - "  🧠 ML:      {{ 'On' if machine_learning else 'Off' }}"
          - "  🌐 Tunnel:  {{ 'Yes' if cf_token else 'Manual DNS needed' }}"
          - "═══════════════════════"
      when: state == "present"
