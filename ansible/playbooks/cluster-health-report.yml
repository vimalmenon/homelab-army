# ──────────────────────────────────────────────────────
# cluster-health-report.yml — Run health report on k3s
# ──────────────────────────────────────────────────────
# Copies the health report script to homelab01,
# runs it, and shows the output.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini \
#     playbooks/cluster-health-report.yml
#
# Optional Telegram delivery:
#   BOT_TOKEN=xxx CHAT_ID=yyy ansible-playbook \
#     -i inventory/hosts.ini playbooks/cluster-health-report.yml \
#     -e telegram=true
# ──────────────────────────────────────────────────────
---
- name: 🔍 Cluster Health Report
  hosts: k3s_master
  gather_facts: false

  vars:
    script_src: files/cluster-health-report.py
    script_dest: /tmp/cluster-health-report.py

  tasks:
    - name: Copy health report script to control-plane
      ansible.builtin.copy:
        src: "{{ script_src }}"
        dest: "{{ script_dest }}"
        mode: "0755"

    - name: Run health report
      ansible.builtin.command:
        cmd: "python3 {{ script_dest }}"
      environment:
        BOT_TOKEN: "{{ lookup('env', 'BOT_TOKEN') | default('', true) }}"
        CHAT_ID: "{{ lookup('env', 'CHAT_ID') | default('', true) }}"
      args:
        chdir: /tmp
      register: report_output
      changed_when: false

    - name: Show report
      ansible.builtin.debug:
        var: report_output.stdout_lines
