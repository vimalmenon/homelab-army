# ──────────────────────────────────────────────────────
# test-kubectl.yml — Test if kubectl works via become
# ──────────────────────────────────────────────────────
---
- name: Test kubectl access
  hosts: k3s_master
  gather_facts: false

  tasks:
    - name: Run kubectl as root
      become: true
      ansible.builtin.command:
        cmd: /usr/local/bin/kubectl get nodes
      register: result
      changed_when: false

    - name: Show output
      ansible.builtin.debug:
        var: result.stdout_lines
