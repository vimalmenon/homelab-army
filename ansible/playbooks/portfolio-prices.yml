---
# Daily portfolio price snapshot, delivered to Telegram.
#
# Targets the Hermes host (Semaphore inventory 7) rather than `hosts: localhost`:
# under Semaphore `localhost` resolves to the Semaphore pod, which has no kubectl
# and no cluster credentials.
#
# RUN IDENTITY — the reason for the `ansible_become: false` play var below.
# Inventory 7 puts .105 in BOTH `[k3s_cluster]` and `[hermes]`, and defines
# `[k3s_cluster:vars] ansible_become=true / ansible_become_user=root`. Group vars
# outrank the `become:` play keyword, so a play that merely says `become: false`
# (or `become_user: hermes`) still executes as root with $HOME=/root — and root
# has no kubectl, because kubectl lives in /home/hermes/.local/bin. Setting the
# *variable* `ansible_become: false` at play level does win, leaving the SSH user
# (`hermes`, credential 5) in place.
#
# The price fetch is piped into the Hestia pod so it reuses the real HOLDINGS map
# and yfinance client. Duplicating the tickers here would silently drift the day
# someone adds a second position.
- name: Portfolio prices
  hosts: hermes
  gather_facts: false
  vars:
    # Beats [k3s_cluster:vars] ansible_become=true — see header comment.
    ansible_become: false

    # kubectl lives in the hermes user's ~/.local/bin, which a non-interactive
    # SSH session does not add to PATH (no profile is sourced). Resolve it
    # explicitly rather than hoping the login shell's PATH is inherited.
    kubectl_dir: /home/hermes/.local/bin

    portfolio_namespace: microservices
    portfolio_deployment: hestia

    # Semaphore does not load repo group_vars, so resolve these from the
    # environment injected by the template's "Telegram" environment (id 3).
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') | default('', true) }}"
    telegram_chat_id: "{{ lookup('env', 'TELEGRAM_CHAT_ID') | default('8145517732', true) }}"
    telegram_parse_mode: HTML

  environment:
    PATH: "{{ kubectl_dir }}:/usr/local/bin:/usr/bin:/bin"

  tasks:
    - name: Confirm run identity and kubectl availability
      ansible.builtin.shell: |
        echo "user=$(whoami) home=$HOME"
        command -v kubectl || echo "kubectl: NOT in PATH"
      register: identity
      changed_when: false

    - name: Fail early unless we are the hermes user with kubectl
      ansible.builtin.assert:
        that:
          - "'user=hermes' in identity.stdout"
          - "'kubectl: NOT in PATH' not in identity.stdout"
        fail_msg: >-
          Wrong run identity ({{ identity.stdout_lines | join(' | ') }}).
          This play must execute as 'hermes' because kubectl and /home/hermes/.kube
          belong to that user. Check for ansible_become/ansible_become_user leaking
          in from the inventory's [k3s_cluster:vars].

    - name: Check the hestia deployment exists
      ansible.builtin.command: >-
        kubectl -n {{ portfolio_namespace }} get deploy {{ portfolio_deployment }} -o name
      register: hestia_deploy
      changed_when: false

    - name: Stage the price script on the target
      ansible.builtin.copy:
        src: ../files/portfolio-prices.py
        dest: /tmp/portfolio-prices.py
        mode: "0644"

    - name: Fetch prices from Hestia
      ansible.builtin.shell: >-
        kubectl -n {{ portfolio_namespace }} exec -i deploy/{{ portfolio_deployment }}
        -- python - < /tmp/portfolio-prices.py
      register: prices
      changed_when: false

    - name: Show the portfolio
      ansible.builtin.debug:
        msg: "{{ prices.stdout_lines }}"

    - name: Warn when the price feed returned nothing
      ansible.builtin.fail:
        msg: "Hestia returned no holdings - check the HOLDINGS map in hestia/src/portfolio.py"
      when: "prices.stdout is search('Positions: 0')"

    # <pre> keeps the table monospaced so the columns line up in Telegram, and
    # '&' must be escaped for parse_mode=HTML (the header contains "P&L").
    - name: Send prices to Telegram
      include_tasks: ../tasks/notify-telegram.yml
      vars:
        telegram_message: "<pre>{{ prices.stdout | replace('&', '&amp;') }}</pre>"
