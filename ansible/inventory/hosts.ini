# ──────────────────────────────────────────────
# homelab-army — Ansible k3s Cluster Inventory
# ──────────────────────────────────────────────
# Run: ansible-playbook -i inventory/hosts.ini playbooks/site.yml
# ──────────────────────────────────────────────

[all:vars]
ansible_user=homelab
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

[k3s_master]
homelab01 ansible_host=192.168.10.104

[k3s_workers]
homelab02 ansible_host=192.168.10.107
homelab03 ansible_host=192.168.10.106

[k3s_cluster:children]
k3s_master
k3s_workers

# Hermes host (.105) — the Ansible control node, not part of the k3s cluster.
# Target for playbooks that need kubectl + AWS creds on the control node,
# e.g. playbooks/backup-health.yml.
[hermes]
hermes-host ansible_host=192.168.10.105 ansible_user=hermes
