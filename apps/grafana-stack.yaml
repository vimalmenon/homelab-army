apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.1.0
    helm:
      releaseName: prometheus
      values: |
        # Matches current live deployment in monitoring namespace

        prometheusOperator:
          enabled: true

        prometheus:
          enabled: true
          prometheusSpec:
            replicas: 1
            retention: 7d
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
            scrapeInterval: 30s
            evaluationInterval: 30s
            serviceMonitorSelector:
              matchLabels:
                release: prometheus
            podMonitorSelector:
              matchLabels:
                release: prometheus
            ruleSelector:
              matchLabels:
                release: prometheus

        grafana:
          enabled: true
          admin:
            user: admin
            password: "REDACTED_GRAFANA_PASSWORD"
          grafana.ini:
            server:
              domain: grafana.completeautomate.com
              root_url: https://grafana.completeautomate.com
            analytics:
              check_for_updates: true
            log:
              mode: console
            paths:
              data: /var/lib/grafana/
              logs: /var/log/grafana
              plugins: /var/lib/grafana/plugins
              provisioning: /etc/grafana/provisioning
          smtp:
            enabled: true
            host: smtp.zoho.com:465
            user: hello@completeautomate.com
            fromAddress: hello@completeautomate.com
            fromName: Grafana Alerts
            skipVerify: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          service:
            type: ClusterIP
            port: 80
          ingress:
            enabled: false
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            datasources:
              enabled: true
              label: grafana_datasource
              labelValue: "1"
              searchNamespace: ALL
          additionalDataSources: []

        kubeStateMetrics:
          enabled: true

        nodeExporter:
          enabled: true

        alertmanager:
          enabled: false

        defaultRules:
          enabled: true
          create: true
          rules:
            alertmanager: false
            configReloaders: true
            etcd: true
            general: true
            k8sContainerCpuUsageSecondsTotal: true
            k8sContainerMemoryMajorPageFaults: true
            k8sContainerMemoryManagement: true
            k8sContainerMemoryPageFaults: true
            k8sContainerMemoryWorkingSetBytes: true
            k8sContainerRequest: true
            k8sContainerResource: true
            k8sContainerThrottling: true
            k8sPodStatusFailed: true
            k8sPodStatusPhase: true
            kubeApiserverAvailability: true
            kubeApiserverBurnrate: true
            kubeApiserverHistogram: true
            kubeApiserverSlos: true
            kubeControllerManager: true
            kubelet: true
            kubeProxy: true
            kubeScheduler: true
            kubeStateMetrics: true
            kubernetesApps: true
            kubernetesResources: true
            kubernetesStorage: true
            kubernetesSystem: true
            kubeVersion: true
            network: true
            node: true
            nodeExporterAlerting: true
            nodeExporterRecording: true
            prometheus: true
            prometheusOperator: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
