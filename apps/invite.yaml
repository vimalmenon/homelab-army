apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invite
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vimalmenon/homelab-army.git
    targetRevision: main
    path: services/invite
  destination:
    server: https://kubernetes.default.svc
    namespace: invite
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The invite ConfigMap embeds a video (binaryData), so its manifest is
      # ~760 KB — over the 256 KB limit for the last-applied-configuration
      # annotation that client-side apply writes. SSA avoids that annotation.
      - ServerSideApply=true
