apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arch-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vimalmenon/homelab-army.git
    targetRevision: main
    path: services/arch-frontend/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: arch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
