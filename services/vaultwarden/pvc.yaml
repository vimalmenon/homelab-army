apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  finalizers:
  - completeautomate.com/protect-deletion
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-client
  volumeMode: Filesystem
