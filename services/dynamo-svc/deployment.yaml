apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-svc
  namespace: microservices
  labels:
    app: dynamo-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-svc
  template:
    metadata:
      labels:
        app: dynamo-svc
    spec:
      containers:
      - name: dynamo-svc
        image: ghcr.io/vimalmenon/micro-army/dynamo-svc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: AWS_REGION
          value: ap-southeast-1
        - name: DYNAMO_TABLE
          value: vimal
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-dynamo-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-dynamo-creds
              key: AWS_SECRET_ACCESS_KEY
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
