---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-backup
  namespace: backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-backup
  namespace: backups
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - secrets
      - services
      - nodes
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-backup
  namespace: backups
subjects:
  - kind: ServiceAccount
    name: homelab-backup
    namespace: backups
roleRef:
  kind: ClusterRole
  name: homelab-backup
  apiGroup: rbac.authorization.k8s.io
