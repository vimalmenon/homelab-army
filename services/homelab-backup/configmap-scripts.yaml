apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-backup-scripts
  namespace: backups
data:
  backup.py: |
    #!/usr/bin/env python3
    """Homelab backup — PVC data + k8s resources → S3."""
    
    import boto3
    import gzip
    import logging
    import os
    import shutil
    import subprocess
    import tarfile
    import tempfile
    from datetime import datetime, timezone, timedelta
    from pathlib import Path
    
    logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")
    log = logging.getLogger("backup")
    
    BUCKET = os.environ["BUCKET"]
    AWS_REGION = os.environ.get("AWS_REGION", "us-east-1")
    NFS_MOUNT = Path("/nfs")
    RETENTION_DAYS = int(os.environ.get("RETENTION_DAYS", "30"))
    BACKUP_PREFIX = f"backups/{datetime.now(timezone.utc).strftime('%Y-%m-%d')}"
    
    def run(cmd: list[str], **kwargs) -> str:
        log.info("Running: %s", " ".join(cmd))
        result = subprocess.run(cmd, capture_output=True, text=True, timeout=300, **kwargs)
        if result.returncode != 0:
            log.warning("Exit %d: %s", result.returncode, result.stderr.strip())
        return result.stdout
    
    def tar_directory(src: Path, dst: Path) -> Path:
        """Tar+gzip a directory into dst/name.tar.gz."""
        out = dst / f"{src.name}.tar.gz"
        with tarfile.open(out, "w:gz") as tar:
            tar.add(src, arcname=src.name)
        log.info("  → %s (%d bytes)", out.name, out.stat().st_size)
        return out
    
    def upload_file(s3, local_path: Path, key: str):
        s3.upload_file(str(local_path), BUCKET, key)
        log.info("  ☁️ Uploaded: %s", key)
    
    def prune_old_backups(s3):
        """Delete backups/older than RETENTION_DAYS."""
        cutoff = datetime.now(timezone.utc) - timedelta(days=RETENTION_DAYS)
        prefix = "backups/"
        log.info("Pruning backups older than %s (%d days)", cutoff.date(), RETENTION_DAYS)
        deleted = 0
        paginator = s3.get_paginator("list_objects_v2")
        for page in paginator.paginate(Bucket=BUCKET, Prefix=prefix):
            for obj in page.get("Contents", []):
                key = obj["Key"]
                # Parse date from key: backups/YYYY-MM-DD/...
                parts = key.split("/")
                if len(parts) >= 2:
                    try:
                        date = datetime.strptime(parts[1], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                        if date < cutoff:
                            s3.delete_object(Bucket=BUCKET, Key=key)
                            deleted += 1
                    except ValueError:
                        continue
        if deleted:
            log.info("Pruned %d old objects", deleted)
    
    def main():
        log.info("=== Homelab Backup ===")
        log.info("Bucket: %s  Prefix: %s", BUCKET, BACKUP_PREFIX)
    
        s3 = boto3.client("s3", region_name=AWS_REGION)
    
        with tempfile.TemporaryDirectory(prefix="homelab-backup-") as tmpdir:
            tmp = Path(tmpdir)
    
            # --- Step 1: PVC data from NFS ---
            pvc_dir = tmp / "pvc"
            pvc_dir.mkdir()
            log.info("📦 Backing up PVCs from NFS...")
            nfs_items = sorted(NFS_MOUNT.iterdir())
            if not nfs_items:
                log.warning("NFS mount at %s is empty!", NFS_MOUNT)
            for item in nfs_items:
                if item.is_dir():
                    tarball = tar_directory(item, pvc_dir)
                    key = f"{BACKUP_PREFIX}/pvc/{tarball.name}"
                    upload_file(s3, tarball, key)
    
            # --- Step 2: k8s resource dump ---
            k8s_dir = tmp / "k8s"
            k8s_dir.mkdir()
            log.info("📋 Dumping k8s resources...")
            resources = {
                "all-resources": ["get", "all", "--all-namespaces", "-o", "yaml"],
                "secrets": ["get", "secrets", "--all-namespaces", "-o", "yaml"],
                "infisicalsecrets": ["get", "infisicalsecrets", "--all-namespaces", "-o", "yaml"],
                "pv": ["get", "pv", "-o", "yaml"],
                "pvc": ["get", "pvc", "--all-namespaces", "-o", "yaml"],
                "namespaces": ["get", "ns", "-o", "yaml"],
                "nodes": ["get", "nodes", "-o", "yaml"],
                "storageclasses": ["get", "sc", "-o", "yaml"],
            }
            for name, args in resources.items():
                out = k8s_dir / f"{name}.yaml"
                try:
                    yaml_text = run(["kubectl"] + args)
                    out.write_text(yaml_text)
                    log.info("  ✓ %s.yaml (%d bytes)", name, out.stat().st_size)
                except Exception as e:
                    log.error("  ✗ %s failed: %s", name, e)
                    out.write_text(f"# Error dumping {name}: {e}\n")
    
            # Upload k8s dump as a single tar
            k8s_tar = tmp / "k8s-dump.tar.gz"
            with tarfile.open(k8s_tar, "w:gz") as tar:
                tar.add(k8s_dir, arcname="k8s")
            key = f"{BACKUP_PREFIX}/k8s-dump.tar.gz"
            upload_file(s3, k8s_tar, key)
    
            log.info("✅ Backup complete: %s", BACKUP_PREFIX)
    
        # --- Step 3: Prune old backups ---
        prune_old_backups(s3)
        log.info("🏁 Done!")
    
    if __name__ == "__main__":
        main()
    
