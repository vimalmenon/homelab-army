apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: homelab-backup
  name: homelab-backup-check
  namespace: backups
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata: {}
    spec:
      backoffLimit: 1
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - 'apk add --no-cache python3 py3-pip >/dev/null 2>&1

              pip3 install boto3 --break-system-packages --quiet 2>/dev/null

              python3 /scripts/check.py

              '
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: aws-dynamo-creds
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: aws-dynamo-creds
            - name: AWS_REGION
              value: us-east-1
            image: alpine:3.19
            imagePullPolicy: IfNotPresent
            name: check
            resources:
              limits:
                cpu: 200m
                memory: 128Mi
              requests:
                cpu: 100m
                memory: 64Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /scripts
              name: scripts
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: homelab-backup
          serviceAccountName: homelab-backup
          terminationGracePeriodSeconds: 30
          volumes:
          - configMap:
              defaultMode: 493
              name: homelab-backup-check-script
            name: scripts
      ttlSecondsAfterFinished: 86400
  schedule: 0 */4 * * *
  successfulJobsHistoryLimit: 2
  suspend: false
