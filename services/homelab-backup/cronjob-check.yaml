apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-backup-check
  namespace: backups
  labels:
    app: homelab-backup
spec:
  schedule: "0 */4 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: homelab-backup
          restartPolicy: Never
          containers:
          - name: check
            image: alpine:3.19
            command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache python3 py3-pip >/dev/null 2>&1
              pip3 install boto3 --break-system-packages --quiet 2>/dev/null
              python3 /scripts/check.py
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-dynamo-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-dynamo-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              value: us-east-1
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
          volumes:
          - name: scripts
            configMap:
              name: homelab-backup-check-script
              defaultMode: 0755
