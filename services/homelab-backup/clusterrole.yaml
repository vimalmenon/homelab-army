apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-backup
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - secrets
      - services
      - nodes
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: [get, list]
