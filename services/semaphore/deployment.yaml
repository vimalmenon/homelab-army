apiVersion: apps/v1
kind: Deployment
metadata:
  name: semaphore
  namespace: semaphore
spec:
  replicas: 1
  # BoltDB at /var/lib/semaphore holds an exclusive file lock, so two pods can
  # never run at once. A RollingUpdate starts the replacement before the old pod
  # exits, and the new one panics with exit code 2 because it cannot open the
  # database. Recreate terminates the old pod first, which is what BoltDB needs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: semaphore
  template:
    metadata:
      labels:
        app: semaphore
    spec:
      containers:
      - name: semaphore
        image: semaphoreui/semaphore:v2.17.17
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          set -e
          # Create admin user (ignore failure if already exists)
          semaphore user add --admin \
            --login admin \
            --name "Vimal Menon" \
            --email hello@completeautomate.com \
            --password "$SEMAPHORE_ADMIN_PASSWORD" \
            --config /etc/semaphore/config.json 2>/dev/null || true
          echo "Starting Semaphore server..."
          exec semaphore server --config /etc/semaphore/config.json
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: SEMAPHORE_PORT
          value: ":3000"
        - name: SEMAPHORE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: semaphore-secrets
              key: admin_password
        - name: SEMAPHORE_ACCESS_KEY_ENCRYPTION
          valueFrom:
            secretKeyRef:
              name: semaphore-secrets
              key: encryption_key
        volumeMounts:
        - mountPath: /etc/semaphore
          name: config
        - mountPath: /var/lib/semaphore
          name: data
        livenessProbe:
          httpGet:
            path: /api/ping
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/ping
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          # 256Mi was too small: an apt run forks 8 ansible-playbook workers
          # (~45Mi each) on top of the ~93Mi server, so the cgroup tipped over
          # and the kernel OOM-killed the whole pod ~52s into the play. Same
          # failure every Saturday. CPU was equally starved at 200m for 8
          # forks, so the run also throttled hard.
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: semaphore-config
      - name: data
        persistentVolumeClaim:
          claimName: semaphore-data
