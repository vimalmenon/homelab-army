apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: athena
  namespace: microservices
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: athena
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
  namespaceSelector:
    matchNames:
    - microservices
