apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki
  namespace: microservices
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Both middlewares: add-https forces the TLS redirect, forwardauth puts the
    # wiki behind Authelia. Without the second one, athena's full CRUD API — read,
    # create, update AND delete articles — is open to the internet. It was
    # reachable unauthenticated until 2026-11-12.
    traefik.ingress.kubernetes.io/router.middlewares: authelia-add-https@kubernetescrd,authelia-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.homelab.local
      http:
        paths:
          - backend:
              service:
                name: athena
                port:
                  number: 8000
            path: /
            pathType: Prefix
    - host: wiki.completeautomate.com
      http:
        paths:
          - backend:
              service:
                name: athena
                port:
                  number: 8000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - wiki.homelab.local
        - wiki.completeautomate.com
