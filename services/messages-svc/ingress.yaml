apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: messages
  namespace: microservices
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: microservices-messages-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: messages.homelab.local
      http:
        paths:
          - backend:
              service:
                name: messages-svc
                port:
                  number: 8000
            path: /
            pathType: Prefix
    - host: messages.completeautomate.com
      http:
        paths:
          - backend:
              service:
                name: messages-svc
                port:
                  number: 8000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - messages.homelab.local
        - messages.completeautomate.com
