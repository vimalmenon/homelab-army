apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages-svc
  namespace: microservices
  labels:
    app: messages-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messages-svc
  template:
    metadata:
      labels:
        app: messages-svc
    spec:
      containers:
      - name: messages-svc
        image: ghcr.io/vimalmenon/micro-army/messages-svc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: DYNAMO_SVC_URL
          value: http://dynamo-svc.microservices.svc.cluster.local:8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
