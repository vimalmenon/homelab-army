apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: messages-api
  namespace: microservices
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api.completeautomate.com
      http:
        paths:
          - backend:
              service:
                name: messages-svc
                port:
                  number: 8000
            path: /messages
            pathType: Prefix
  tls:
    - hosts:
        - api.completeautomate.com
