apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: netalertx
  name: netalertx
  namespace: netalertx
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: netalertx
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: netalertx
    spec:
      containers:
      - env:
        - name: PORT
          value: '20211'
        - name: TZ
          value: Asia/Hong_Kong
        - name: APP_CONF_OVERRIDE
          value: '{"GRAPHQL_PORT":"20214"}'
        image: ghcr.io/netalertx/netalertx:26.6.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          # This page is a PHP app that hits the device database; measured at
          # 2.7-4.8s on a quiet node. A 5s timeout sat right on the edge, so any
          # spike tripped it and the kubelet killed a healthy container — that was
          # 360 restarts in two days, all of them probe kills (exit 143), not OOMs.
          failureThreshold: 5
          httpGet:
            path: /
            port: 20211
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: netalertx
        ports:
        - containerPort: 20211
          name: web
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 20211
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            # Was 500m, which throttled 191 of 478 scheduling periods — the app
            # spent more time blocked by its CPU quota than executing it, and that
            # is what made the web UI slow enough to fail its own probe.
            cpu: 2000m
            # Was 768Mi — netalertx ran at ~500Mi baseline and spiked past the
            # cap, earning ~1,900 OOMKills. Headroom above the observed peak.
            memory: 1536Mi
          requests:
            cpu: 300m
            memory: 256Mi
        startupProbe:
          # Generous boot allowance: scans and the OUI DB import run at start-up,
          # and the app should not be killed for being slow to come up.
          failureThreshold: 30
          httpGet:
            path: /
            port: 20211
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 10
        securityContext:
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /data/config /data/db
        image: busybox
        imagePullPolicy: Always
        name: init-dirs
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
      nodeSelector:
        kubernetes.io/hostname: homelab03
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 20211
        runAsGroup: 20211
        runAsUser: 20211
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: netalertx-data
      - emptyDir:
          medium: Memory
        name: tmp
      - hostPath:
          path: /etc/localtime
          type: File
        name: localtime
