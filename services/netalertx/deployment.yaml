apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: netalertx
  name: netalertx
  namespace: netalertx
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: netalertx
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: netalertx
    spec:
      containers:
      - env:
        - name: PORT
          value: '20211'
        - name: TZ
          value: Asia/Hong_Kong
        - name: APP_CONF_OVERRIDE
          value: '{"GRAPHQL_PORT":"20214"}'
        image: ghcr.io/netalertx/netalertx:26.10.28
        imagePullPolicy: IfNotPresent
        livenessProbe:
          # Probes a static asset, NOT /. Root cause of the old probe kills: GET /
          # returns 302 -> /devices.php, and the kubelet's HTTP client FOLLOWS
          # redirects, so every probe rendered a full PHP+SQLite page (3-7s) and
          # burned ~half a PHP worker (measured: 16 renders/150s at 4.6s each,
          # with 226 probe failures logged against /devices.php). nginx serves
          # this file in 0.5ms with no PHP and no DB involvement, so liveness now
          # means "process and web server alive" and a slow page can no longer
          # kill a healthy container.
          failureThreshold: 3
          httpGet:
            path: /lib/bootstrap/bootstrap.min.js
            port: 20211
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: netalertx
        ports:
        - containerPort: 20211
          name: web
          protocol: TCP
        readinessProbe:
          # Readiness must mean "the app can serve", not "nginx is up": the
          # backend initialises for ~13 min after start (54 plugin checks over
          # NFS) while nginx serves static files immediately. Reading the
          # backend's own state file is accurate, costs ~1ms, and only routes
          # traffic once the GraphQL server is actually listening.
          exec:
            command:
            - sh
            - -c
            - grep -qE '"graphQLServerStarted":[[:space:]]*1' /tmp/api/app_state.json
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            # Was 500m, which throttled 191 of 478 scheduling periods — the app
            # spent more time blocked by its CPU quota than executing it, and that
            # is what made the web UI slow enough to fail its own probe.
            cpu: 2000m
            # Was 768Mi — netalertx ran at ~500Mi baseline and spiked past the
            # cap, earning ~1,900 OOMKills. Headroom above the observed peak.
            memory: 1536Mi
          requests:
            cpu: 300m
            memory: 256Mi
        startupProbe:
          # Boot takes ~13 min here (54 plugin checks over NFS) and the old
          # 30 x 10s allowance (5 min) expired long before the app was usable,
          # so every restart spent its last minutes flapping NotReady. Wait on
          # the backend itself with a 20 min ceiling, then hand over to readiness.
          exec:
            command:
            - sh
            - -c
            - grep -qE '"graphQLServerStarted":[[:space:]]*1' /tmp/api/app_state.json
          failureThreshold: 120
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - mkdir -p /data/config /data/db
        image: busybox
        imagePullPolicy: Always
        name: init-dirs
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
      nodeSelector:
        kubernetes.io/hostname: homelab03
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 20211
        runAsGroup: 20211
        runAsUser: 20211
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: netalertx-data
      - emptyDir:
          medium: Memory
        name: tmp
      - hostPath:
          path: /etc/localtime
          type: File
        name: localtime
