    \   { from: 'n8n', to: 'helios' },\n  ],\n  flows: {\n    'site-main': {\n      label:
    'User visits completeautomate.com',\n      hops: [\n        { node: 'dns', duration:
    200 },\n        { arrow: ['dns','site-main'], node: 'site-main', duration: 200
    },\n        { arrow: ['site-main','angelos'], node: 'angelos', duration: 300 },\n
    \     ]\n    },\n    'pythia': {\n      label: 'AI Lead Enrichment',\n      hops:
    [\n        { node: 'pythia', duration: 300 },\n        { arrow: ['pythia','openrouter'],
    node: 'openrouter', duration: 600 },\n        { arrow: ['pythia','s3'], node:
    's3', duration: 400 },\n      ]\n    },\n    'angelos': {\n      label: 'Contact
    Form → Email',\n      hops: [\n        { node: 'angelos', duration: 200 },\n        {
    arrow: ['angelos','iris'], node: 'iris', duration: 300 },\n        { arrow: ['iris','zoho'],
    node: 'zoho', duration: 300 },\n      ]\n    },\n    'clio': {\n      label: 'DynamoDB
