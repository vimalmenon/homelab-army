    } from 'three/addons/geometries/RoundedBoxGeometry.js';\n\n// ─── Data Model ───────────────────────────────────────────────────────────\n\nconst
    environments = {};\nenvironments.overview = {\n  label: '\U0001F310 Full Overview',\n
    \ layers: [\n    { id: 'cloudflare', label: '☁️ Cloudflare', z: 300, w: 2000,
    h: 140 },\n    { id: 'public-sites', label: '\U0001F310 Public Sites', z: 220,
    w: 2000, h: 130 },\n    { id: 'services', label: '⚙️ Services', z: 140, w: 2200,
