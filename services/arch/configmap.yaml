    k3s cluster.', url: '' },\n    { id: 'ssl', layer: 'cloudflare', label: 'SSL/TLS',
    subtitle: 'Edge Termination', x: 300, z: 300, w: 200, h: 60, cat: 'infrastructure',
    desc: 'SSL termination at Cloudflare edge.', url: '' },\n    // Public Sites\n
    \   { id: 'site-main', layer: 'public-sites', label: 'completeautomate.com', subtitle:
    'Main Website', x: -800, z: 220, w: 220, h: 60, cat: 'site', desc: 'Public marketing
    website.', url: 'https://completeautomate.com' },\n    { id: 'site-admin', layer:
    'public-sites', label: 'admin.completeautomate.com', subtitle: 'Helios Dashboard',
