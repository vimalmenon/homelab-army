apiVersion: v1
data:
  arch.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta
    name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Complete
    Automate — System Architecture</title>\n<style>\n  * { margin: 0; padding: 0;
    box-sizing: border-box; }\n  html, body { width: 100%; height: 100%; overflow:
    hidden; background: #0b0b1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe
    UI', sans-serif; }\n\n  #three-container { width: 100%; height: 100%; position:
    fixed; top: 0; left: 0; touch-action: none; }\n\n  /* Environment switcher */\n
    \ #env-bar {\n    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 20;\n    display: flex; gap: 4px; background: rgba(15,15,35,0.85); padding:
    4px; border-radius: 10px;\n    backdrop-filter: blur(8px); border: 1px solid rgba(74,74,138,0.3);\n
    \ }\n  #env-bar button {\n    background: transparent; color: #8888cc; border:
    none; padding: 8px 18px;\n    border-radius: 7px; cursor: pointer; font-size:
    13px; font-weight: 500;\n    transition: all 0.2s;\n  }\n  #env-bar button:hover
    { color: #aaccff; background: rgba(74,74,138,0.2); }\n  #env-bar button.active
    { color: #fff; background: rgba(85,85,204,0.3); }\n\n  /* Loading overlay */\n
    \ #loading {\n    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100;\n    display: flex; align-items: center; justify-content: center;\n
    \   background: #0b0b1a; color: #8888cc; font-size: 18px; transition: opacity
    0.5s;\n  }\n  #loading.hidden { opacity: 0; pointer-events: none; }\n\n  /* Detail
    panel */\n  #detail-panel {\n    position: fixed; top: 0; right: -360px; width:
    340px; height: 100%; z-index: 30;\n    background: rgba(11,11,26,0.92); backdrop-filter:
    blur(12px);\n    border-left: 1px solid rgba(74,74,138,0.3); padding: 24px;\n
    \   transition: right 0.3s cubic-bezier(0.16,1,0.3,1);\n    overflow-y: auto;
    color: #ccc;\n  }\n  #detail-panel.open { right: 0; }\n  #detail-close {\n    position:
    absolute; top: 16px; right: 16px; background: none; border: none;\n    color:
    #666; font-size: 22px; cursor: pointer;\n  }\n  #detail-close:hover { color: #fff;
    }\n  #detail-name { font-size: 20px; font-weight: 600; color: #fff; margin-bottom:
    4px; }\n  #detail-layer { font-size: 13px; color: #8888cc; margin-bottom: 16px;
    }\n  #detail-desc { font-size: 14px; line-height: 1.6; color: #aaa; margin-bottom:
    16px; }\n  #detail-url { display: inline-block; padding: 7px 16px; border-radius:
    6px; background: rgba(68,136,204,0.15);\n    color: #68b8ff; text-decoration:
    none; font-size: 13px; margin-bottom: 16px; }\n  #detail-url:hover { background:
    rgba(68,136,204,0.25); }\n  #detail-actions { display: flex; gap: 8px; margin-bottom:
    16px; flex-wrap: wrap; }\n  #detail-actions button {\n    padding: 7px 14px; border-radius:
    6px; border: 1px solid rgba(74,74,138,0.4);\n    background: rgba(15,15,35,0.8);
    color: #aaccff; cursor: pointer; font-size: 13px;\n    transition: all 0.2s;\n
    \ }\n  #detail-actions button:hover { background: rgba(68,136,204,0.2); border-color:
    #4488cc; }\n  #detail-actions button:disabled { opacity: 0.4; cursor: not-allowed;
    }\n  #detail-status { font-size: 13px; color: #aaa; margin-top: 8px; font-style:
    italic; }\n  #detail-flow-status { font-size: 13px; color: #00e5ff; margin-top:
    8px; display: none; }\n\n  /* Legend */\n  #legend {\n    position: fixed; bottom:
    24px; left: 24px; z-index: 20;\n    background: rgba(15,15,35,0.8); border: 1px
    solid rgba(74,74,138,0.3);\n    border-radius: 10px; padding: 12px 16px; font-size:
    12px; color: #8888cc;\n    backdrop-filter: blur(6px); max-width: 200px;\n  }\n
    \ #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0;
    }\n  #legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink:
    0; }\n  #legend .dot.infrastructure { background: #5555cc; }\n  #legend .dot.site
    { background: #44aa44; }\n  #legend .dot.cluster { background: #cc4444; }\n  #legend
    .dot.service { background: #8844cc; }\n  #legend .dot.external { background: #4488cc;
    }\n  #legend .dot.connection { background: #6666aa; }\n</style>\n</head>\n<body>\n\n<div
    id=\"loading\">Loading...</div>\n\n<div id=\"env-bar\"></div>\n\n<div id=\"three-container\"></div>\n\n<div
    id=\"detail-panel\">\n  <button id=\"detail-close\">✕</button>\n  <div id=\"detail-name\"></div>\n
    \ <div id=\"detail-layer\"></div>\n  <div id=\"detail-desc\"></div>\n  <a id=\"detail-url\"
    target=\"_blank\"></a>\n  <div id=\"detail-actions\">\n    <button id=\"btn-show-flow\">▶
    Show Flow</button>\n    <button id=\"btn-focus-mode\">◎ Focus Mode</button>\n
    \   <button id=\"btn-reset-flow\">✖ Reset</button>\n  </div>\n  <div id=\"detail-flow-status\"></div>\n
    \ <div id=\"detail-status\"></div>\n</div>\n\n<div id=\"legend\">\n  <div class=\"row\"><span
    class=\"dot infrastructure\"></span> Networking / Infra</div>\n  <div class=\"row\"><span
    class=\"dot site\"></span> Public Sites</div>\n  <div class=\"row\"><span class=\"dot
    cluster\"></span> Cluster Infrastructure</div>\n  <div class=\"row\"><span class=\"dot
    service\"></span> Microservices</div>\n  <div class=\"row\"><span class=\"dot
    external\"></span> External / SaaS</div>\n  <div class=\"row\"><span class=\"dot
    connection\"></span> Connections</div>\n</div>\n\n<script type=\"importmap\">\n{\n
    \ \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.160.0/build/three.module.js\",\n
    \   \"three/addons/\": \"https://unpkg.com/three@0.160.0/examples/jsm/\"\n  }\n}\n</script>\n\n<script
