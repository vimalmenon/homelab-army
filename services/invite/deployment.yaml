apiVersion: apps/v1
kind: Deployment
metadata:
  name: invite
  namespace: invite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invite
  template:
    metadata:
      labels:
        app: invite
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        # Open Graph share image, served at /assets/og.jpg. Kept in its own
        # ConfigMap because invite-html is already ~800 KB (1 MiB object limit).
        # Mounted as a directory, NOT subPath — bind-mounting a single file into
        # the read-only configMap directory fails with "not a directory".
        - name: og
          mountPath: /usr/share/nginx/html/assets
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: invite-html
      - name: og
        configMap:
          name: invite-og
