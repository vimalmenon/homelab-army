apiVersion: v1
kind: ConfigMap
metadata:
  name: invite-html
  namespace: invite
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krishiv's 4th Birthday — Paw Patrol Party!</title>
    <meta name="description" content="You're invited to Krishiv's 4th birthday Paw Patrol party — Saturday 28 November 2026.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
    <style>
      :root{
        --blue:#0b4ea2;
        --blue-dark:#073a7d;
        --sky:#4fc3f7;
        --sky-light:#bfe9ff;
        --red:#e63329;
        --yellow:#ffc72c;
        --cream:#fffaf0;
        --ink:#0d2c57;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
        font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
        color:var(--ink);
        background:
          radial-gradient(circle at 15% 8%, #e8f8ff 0%, #b3e5ff 35%, #6cc9f5 70%, #38a9e6 100%);
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:26px 16px 40px;
        overflow-x:hidden;
        position:relative;
      }
    
      /* floating paw prints in the background */
      .bg-paws{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
      .bg-paws svg{
        position:absolute;
        fill:#ffffff;
        opacity:.22;
        animation:float 14s ease-in-out infinite;
      }
      .bg-paws svg:nth-child(1){width:70px;top:8%;left:6%;animation-delay:0s;transform:rotate(-18deg);}
      .bg-paws svg:nth-child(2){width:46px;top:22%;right:9%;animation-delay:2s;transform:rotate(24deg);}
      .bg-paws svg:nth-child(3){width:88px;bottom:10%;left:12%;animation-delay:4s;transform:rotate(12deg);}
      .bg-paws svg:nth-child(4){width:54px;bottom:20%;right:14%;animation-delay:1s;transform:rotate(-30deg);}
      .bg-paws svg:nth-child(5){width:38px;top:52%;left:4%;animation-delay:3s;transform:rotate(40deg);}
      .bg-paws svg:nth-child(6){width:62px;top:70%;right:4%;animation-delay:5s;transform:rotate(-8deg);}
      @keyframes float{
        0%,100%{transform:translateY(0) rotate(0deg);}
        50%{transform:translateY(-18px) rotate(6deg);}
      }
    
      .card{
        position:relative;
        z-index:1;
        width:100%;
        max-width:600px;
        background:var(--cream);
        border-radius:32px;
        padding:34px 30px 30px;
        box-shadow:
          0 24px 60px rgba(4,40,88,.35),
          0 0 0 10px rgba(255,255,255,.55),
          0 0 0 18px rgba(11,78,162,.16);
        text-align:center;
        animation:pop .55s cubic-bezier(.2,.9,.3,1.4) both;
      }
      @keyframes pop{
        from{opacity:0;transform:scale(.94) translateY(14px);}
        to{opacity:1;transform:scale(1) translateY(0);}
      }
    
      /* ── top badge ───────────────────────────────── */
      .badge-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
      .shield{width:52px;height:58px;flex:0 0 auto;}
    
      .eyebrow{
        font-size:12px;
        letter-spacing:.28em;
        text-transform:uppercase;
        font-weight:700;
        color:var(--red);
        margin:0 0 2px;
      }
      h1{
        margin:0;
        font-family:"Impact","Arial Black","Trebuchet MS",sans-serif;
        font-size:clamp(34px,10vw,52px);
        line-height:.95;
        letter-spacing:.02em;
        color:var(--blue);
        text-shadow:3px 3px 0 #ffffff, 6px 6px 0 rgba(11,78,162,.18);
      }
      .h1-sub{
        display:inline-block;
        margin-top:8px;
        font-family:"Trebuchet MS",sans-serif;
        font-size:clamp(15px,4.2vw,19px);
        font-weight:700;
        letter-spacing:.12em;
        text-transform:uppercase;
        color:#ffffff;
        background:var(--red);
        padding:7px 18px;
        border-radius:999px;
        box-shadow:0 6px 0 var(--blue-dark);
      }
    
      .tagline{
        margin:20px auto 4px;
        max-width:420px;
        font-style:italic;
        font-size:15px;
        line-height:1.5;
        color:#3a5b8c;
      }
    
      .paw-divider{
        display:flex;align-items:center;justify-content:center;gap:10px;
        margin:20px 0 22px;
      }
      .paw-divider .line{height:3px;flex:1;max-width:120px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--sky));}
      .paw-divider .line.right{background:linear-gradient(90deg,var(--sky),transparent);}
      .paw-divider svg{width:30px;fill:var(--blue);opacity:.85;}
    
      /* ── details ─────────────────────────────────── */
      .details{
        display:grid;
        gap:12px;
        text-align:left;
        margin:0 auto;
        max-width:440px;
      }
      .detail{
        display:flex;
        align-items:center;
        gap:14px;
        background:#ffffff;
        border:3px solid var(--sky-light);
        border-radius:18px;
        padding:13px 16px;
        box-shadow:0 4px 0 rgba(79,195,247,.28);
      }
      .detail .ico{
        flex:0 0 auto;
        width:44px;height:44px;
        display:grid;place-items:center;
        border-radius:14px;
        background:var(--blue);
        font-size:21px;
        box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
      }
      .detail .txt{line-height:1.25;}
      .detail .label{
        display:block;
        font-size:10.5px;
        letter-spacing:.16em;
        text-transform:uppercase;
        font-weight:700;
        color:#7b93b5;
        margin-bottom:2px;
      }
      .detail .value{
        font-size:16.5px;
        font-weight:700;
        color:var(--ink);
      }
      .detail .value small{font-weight:600;color:#5a7397;font-size:13.5px;}
    
      a.rsvp{
        color:var(--blue);
        text-decoration:none;
        border-bottom:2px dashed var(--sky);
      }
      a.rsvp:hover{color:var(--red);border-bottom-color:var(--red);}
    
      /* ── call to action ──────────────────────────── */
      .cta{
        display:inline-flex;
        align-items:center;
        gap:10px;
        margin-top:26px;
        padding:15px 30px;
        background:linear-gradient(180deg,#ffd85e,var(--yellow));
        color:#5a3b00;
        font-weight:800;
        font-size:16px;
        letter-spacing:.06em;
        text-transform:uppercase;
        text-decoration:none;
        border-radius:999px;
        border:0;
        box-shadow:0 5px 16px rgba(217,155,0,.4), inset 0 -2px 0 rgba(190,130,0,.22);
        transition:transform .12s ease, box-shadow .12s ease;
      }
      .cta:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(217,155,0,.48), inset 0 -2px 0 rgba(190,130,0,.22);}
      .cta:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(217,155,0,.42), inset 0 -2px 0 rgba(190,130,0,.22);}
    
      /* WhatsApp glyph sits inline with the button label */
      .wa-ico{
        width:1.25em;height:1.25em;
        flex:0 0 auto;
        fill:currentColor;
        vertical-align:-0.22em;
      }
    
      /* ── RSVP headcount box ──────────────────────── */
      .rsvp-box{
        margin:26px auto 0;
        max-width:440px;
        background:#ffffff;
        border:3px solid var(--sky-light);
        border-radius:22px;
        padding:20px 18px 20px;
        box-shadow:0 4px 0 rgba(79,195,247,.28);
        text-align:left;
      }
      .rsvp-title{
        margin:0 0 3px;
        font-size:16.5px;font-weight:800;color:var(--blue);
      }
      .rsvp-sub{
        margin:0 0 14px;
        font-size:12.5px;color:#7b93b5;line-height:1.45;
      }
      .stepper{
        display:flex;align-items:center;justify-content:space-between;
        padding:10px 0;
        border-top:2px dashed #e5f2fb;
      }
      .stepper:first-of-type{border-top:0;padding-top:2px;}
      .stepper-label{font-size:15px;font-weight:700;color:var(--ink);}
      .stepper-ctrl{display:flex;align-items:center;gap:13px;}
      .stepper-ctrl button{
        width:34px;height:34px;border-radius:50%;
        border:0;background:var(--blue);color:#fff;
        font-size:19px;font-weight:700;line-height:1;cursor:pointer;
        box-shadow:0 3px 8px rgba(11,78,162,.32), inset 0 -2px 0 rgba(0,0,0,.16);
        transition:transform .1s ease,background .15s ease,box-shadow .15s ease;
      }
      .stepper-ctrl button:hover{background:var(--red);box-shadow:0 4px 10px rgba(230,51,41,.36), inset 0 -2px 0 rgba(0,0,0,.16);}
      .stepper-ctrl button:active{transform:translateY(1px);box-shadow:0 2px 5px rgba(11,78,162,.3), inset 0 -2px 0 rgba(0,0,0,.2);}
      .stepper-ctrl button:disabled{background:#c3d6e8;box-shadow:none;cursor:not-allowed;}
      .stepper-ctrl .count{
        min-width:26px;text-align:center;
        font-size:19px;font-weight:800;color:var(--blue);
        font-variant-numeric:tabular-nums;
      }
      .rsvp-total{
        margin:12px 0 0;
        font-size:13px;font-weight:700;color:#3a5b8c;
      }
      .rsvp-box .cta{display:flex;width:100%;justify-content:center;margin-top:16px;}
      .cta-no{
        display:block;margin:13px auto 0;
        width:max-content;
        font-size:12.5px;font-weight:700;color:#8aa2bf;
        text-decoration:none;border-bottom:2px dashed #cbdcec;
      }
      .cta-no:hover{color:var(--red);border-bottom-color:var(--red);}
    
      .footnote{
        margin-top:22px;
        font-size:12.5px;
        color:#7b93b5;
        line-height:1.6;
      }
      .footnote strong{color:var(--blue);}
    
      /* ── video hero ──────────────────────────────── */
      .video-hero{
        position:relative;
        width:min(300px,80%);
        margin:0 auto 22px;
        border-radius:22px;
        overflow:hidden;
        aspect-ratio:416/640;
        background:#0b4ea2;
        border:5px solid #ffffff;
        box-shadow:0 14px 34px rgba(4,40,88,.32), 0 0 0 3px rgba(11,78,162,.16);
      }
      .video-hero video{display:block;width:100%;height:100%;object-fit:cover;}
      .sound-btn{
        position:absolute;right:8px;top:8px;
        width:38px;height:38px;
        display:grid;place-items:center;
        border:0;border-radius:50%;
        background:rgba(11,78,162,.8);
        color:#fff;font-size:17px;line-height:1;cursor:pointer;
        backdrop-filter:blur(4px);
        transition:background .15s ease,transform .12s ease;
        z-index:2;
      }
      .sound-btn:hover{background:rgba(230,51,41,.92);transform:scale(1.06);}
    
      .sound-hint{
        position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
        display:inline-flex;align-items:center;gap:6px;
        padding:8px 16px;
        border:2px solid rgba(255,255,255,.9);
        border-radius:999px;
        background:rgba(11,78,162,.88);
        color:#fff;font-size:12.5px;font-weight:700;
        letter-spacing:.04em;white-space:nowrap;
        cursor:pointer;z-index:2;
        backdrop-filter:blur(4px);
        animation:pulseHint 2.2s ease-in-out infinite;
      }
      .sound-hint:hover{background:rgba(230,51,41,.95);}
      .sound-hint[hidden]{display:none;}
      @keyframes pulseHint{
        0%,100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 0 rgba(255,199,44,.6);}
        50%{transform:translateX(-50%) scale(1.045);box-shadow:0 0 0 12px rgba(255,199,44,0);}
      }
    
      @media (max-width:420px){
        .card{padding:26px 18px 24px;border-radius:26px;}
        .detail{padding:11px 13px;gap:11px;}
        .detail .ico{width:38px;height:38px;font-size:18px;border-radius:12px;}
        .detail .value{font-size:15px;}
      }
    </style>
    </head>
    <body>
    
    <div class="bg-paws" aria-hidden="true">
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
    </div>
    
    <main class="card">
      <div class="video-hero">
        <video id="inviteVideo" src="invite.mp4" loop muted playsinline preload="auto"
               aria-label="Animated Paw Patrol birthday invitation for Krishiv"></video>
        <button class="sound-btn" id="soundBtn" type="button" aria-label="Turn sound on" title="Toggle sound">&#128263;</button>
        <button class="sound-hint" id="soundHint" type="button">&#128266; Tap for sound</button>
      </div>
    
      <div class="badge-row">
        <svg class="shield" viewBox="0 0 100 112" aria-hidden="true">
          <path d="M50 2 96 18v40c0 26-19 44-46 52C23 102 4 84 4 58V18L50 2Z" fill="#0b4ea2"/>
          <path d="M50 10 88 23v35c0 22-16 37-38 44C28 95 12 80 12 58V23L50 10Z" fill="#4fc3f7"/>
          <ellipse cx="50" cy="72" rx="17" ry="14" fill="#fffaf0"/>
          <ellipse cx="31" cy="54" rx="7.5" ry="9.5" fill="#fffaf0"/>
          <ellipse cx="45" cy="43" rx="7.5" ry="10" fill="#fffaf0"/>
          <ellipse cx="59" cy="43" rx="7.5" ry="10" fill="#fffaf0"/>
          <ellipse cx="72" cy="54" rx="7.5" ry="9.5" fill="#fffaf0"/>
        </svg>
        <div>
          <p class="eyebrow">Paw Patrol Party</p>
          <h1>KRISHIV<br>IS FOUR!</h1>
        </div>
      </div>
    
      <span class="h1-sub">🎉 You're Invited!</span>
    
      <p class="tagline">“No job is too big, no pup is too small!”<br>
      Come help us celebrate Krishiv's <strong>4th birthday</strong> — pups, cake and big rescue missions await.</p>
    
      <div class="paw-divider" aria-hidden="true">
        <span class="line"></span>
        <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
        <span class="line right"></span>
      </div>
    
      <div class="details">
        <div class="detail">
          <div class="ico" aria-hidden="true">📅</div>
          <div class="txt">
            <span class="label">Date</span>
            <span class="value">Saturday, 28 November 2026</span>
          </div>
        </div>
    
        <div class="detail">
          <div class="ico" aria-hidden="true">⏰</div>
          <div class="txt">
            <span class="label">Time</span>
            <span class="value">6:00 PM</span>
          </div>
        </div>
    
        <div class="detail">
          <div class="ico" aria-hidden="true">📍</div>
          <div class="txt">
            <span class="label">Venue</span>
            <span class="value">Room No. 2, Caribbean Coast Club House</span>
          </div>
        </div>
    
        <div class="detail">
          <div class="ico" aria-hidden="true">📞</div>
          <div class="txt">
            <span class="label">RSVP</span>
            <span class="value"><a class="rsvp" href="tel:+85263523532">+852 6352 3532</a></span>
          </div>
        </div>
      </div>
    
      <section class="rsvp-box">
        <h2 class="rsvp-title">Who's coming? 🐾</h2>
        <p class="rsvp-sub">Set your headcount, then send it to us on WhatsApp — takes 5 seconds.</p>
    
        <div class="stepper">
          <span class="stepper-label">Adults</span>
          <div class="stepper-ctrl">
            <button type="button" id="adultsMinus" aria-label="One fewer adult">−</button>
            <span class="count" id="adultsCount">2</span>
            <button type="button" id="adultsPlus" aria-label="One more adult">+</button>
          </div>
        </div>
    
        <div class="stepper">
          <span class="stepper-label">Children</span>
          <div class="stepper-ctrl">
            <button type="button" id="childrenMinus" aria-label="One fewer child">−</button>
            <span class="count" id="childrenCount">1</span>
            <button type="button" id="childrenPlus" aria-label="One more child">+</button>
          </div>
        </div>
    
        <p class="rsvp-total" id="rsvpTotal">Total: 3 guests</p>
    
        <a class="cta" id="rsvpYes" href="https://wa.me/85263523532" target="_blank" rel="noopener">
          <span aria-hidden="true">🐾</span> Send RSVP
          <svg class="wa-ico" viewBox="0 0 24 24" role="img" aria-label="WhatsApp"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.885 3.488"/></svg>
        </a>
        <a class="cta-no" id="rsvpNo" href="https://wa.me/85263523532" target="_blank" rel="noopener">Sorry, we can't make it</a>
      </section>
    
      <p class="footnote">
        Kindly RSVP by <strong>21 November</strong> so we can get the pup packs ready.<br>
        Paw Patrol fancy dress is very welcome! 🐶
      </p>
    </main>
    
    <script>
      (function () {
        var v = document.getElementById('inviteVideo');
        var b = document.getElementById('soundBtn');
        var hint = document.getElementById('soundHint');
        if (!v || !b) return;
    
        var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    
        function start() {
          if (reduceMotion) { return; }
          var p = v.play();
          if (p && p.catch) { p.catch(function () {}); }
        }
    
        // Playback only begins once the page has finished loading.
        if (document.readyState === 'complete') {
          start();
        } else {
          window.addEventListener('load', start, { once: true });
        }
        // Restoring from the back/forward cache fires no load event.
        window.addEventListener('pageshow', function (ev) { if (ev.persisted) { start(); } });
    
        function sync() {
          b.textContent = v.muted ? '🔇' : '🔊';
          b.setAttribute('aria-label', v.muted ? 'Turn sound on' : 'Turn sound off');
          if (hint) { hint.hidden = !v.muted; }
        }
    
        function withSound() {
          v.muted = false;
          v.volume = 1;
          var p = v.play();
          if (p && p.catch) { p.catch(function () {}); }
          sync();
        }
    
        // Browsers block autoplay WITH sound, so the clip starts muted and the
        // audio switches on at the visitor's very first tap / click / key press.
        var gestures = ['pointerdown', 'touchstart', 'keydown'];
        function firstGesture(e) {
          var t = e && e.target;
          if (t && t.closest && t.closest('#soundBtn, #soundHint')) { return; }
          gestures.forEach(function (ev) { window.removeEventListener(ev, firstGesture); });
          if (v.muted) { withSound(); }
        }
        gestures.forEach(function (ev) {
          window.addEventListener(ev, firstGesture, { passive: true });
        });
    
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          if (v.muted) { withSound(); } else { v.muted = true; sync(); }
        });
    
        if (hint) {
          hint.addEventListener('click', function (e) {
            e.stopPropagation();
            withSound();
          });
        }
    
        v.addEventListener('volumechange', sync);
        sync();
      })();
    </script>
    
    <script>
      (function () {
        var PHONE = '85263523532';
        var MIN = 0, MAX = 12;
        var n = { adults: 2, children: 1 };
    
        var elA = document.getElementById('adultsCount');
        var elC = document.getElementById('childrenCount');
        var elTotal = document.getElementById('rsvpTotal');
        var yes = document.getElementById('rsvpYes');
        var no = document.getElementById('rsvpNo');
        if (!elA || !yes) return;
    
        function plural(num, one, many) { return num === 1 ? one : many; }
    
        function render() {
          elA.textContent = n.adults;
          elC.textContent = n.children;
    
          var total = n.adults + n.children;
          elTotal.textContent = total === 0
            ? 'Add at least one guest to RSVP'
            : 'Total: ' + total + ' ' + plural(total, 'guest', 'guests');
    
          var body =
            "\uD83D\uDC3E RUFF! RSVP for Krishiv's 4th birthday Paw Patrol party!\n" +
            'Our pack reporting for duty: ' + n.adults + ' ' + plural(n.adults, 'adult', 'adults') +
            ' + ' + n.children + ' ' + plural(n.children, 'pup', 'pups') +
            ' (' + total + ' in total).\n' +
            'See you Saturday 28 Nov at 6:00 PM \u2014 Paw Patrol is on a roll!';
    
          yes.href = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(body);
          yes.style.opacity = total === 0 ? '.55' : '1';
    
          no.href = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(
            '\uD83D\uDC3E Aww \u2014 our pack can\u2019t make it to Krishiv\u2019s 4th birthday Paw Patrol party on 28 Nov. Have a pawsome day! \uD83D\uDC36'
          );
    
          document.getElementById('adultsMinus').disabled = n.adults <= MIN;
          document.getElementById('adultsPlus').disabled = n.adults >= MAX;
          document.getElementById('childrenMinus').disabled = n.children <= MIN;
          document.getElementById('childrenPlus').disabled = n.children >= MAX;
        }
    
        function wire(plus, minus, key) {
          document.getElementById(plus).addEventListener('click', function () {
            if (n[key] < MAX) { n[key]++; render(); }
          });
          document.getElementById(minus).addEventListener('click', function () {
            if (n[key] > MIN) { n[key]--; render(); }
          });
        }
    
        wire('adultsPlus', 'adultsMinus', 'adults');
        wire('childrenPlus', 'childrenMinus', 'children');
    
        yes.addEventListener('click', function (e) {
          if (n.adults + n.children === 0) {
            e.preventDefault();
            elTotal.textContent = 'Please add at least one guest first';
          }
        });
    
        render();
      })();
    </script>
    
    </body>
    </html>
