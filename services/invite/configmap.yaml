apiVersion: v1
kind: ConfigMap
metadata:
  name: invite-html
  namespace: invite
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krishiv's 4th Birthday — Paw Patrol Party!</title>
    <meta name="description" content="You're invited to Krishiv's 4th birthday Paw Patrol party — Sunday 29 November 2026.">
    
    <!-- Link previews: WhatsApp, iMessage, Slack, Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://invite.completeautomate.com/">
    <meta property="og:site_name" content="Krishiv's 4th Birthday">
    <meta property="og:title" content="Krishiv is turning FOUR! 🐾 Paw Patrol Party">
    <meta property="og:description" content="Sunday 29 November 2026, 5:30 PM · Room No. 2, Caribbean Coast Club House. Set your headcount and RSVP in 5 seconds — no job is too big, no pup is too small!">
    <meta property="og:image" content="https://invite.completeautomate.com/assets/og-efb2b4.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:image:alt" content="Paw Patrol birthday invitation for Krishiv's 4th birthday">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Krishiv is turning FOUR! 🐾 Paw Patrol Party">
    <meta name="twitter:description" content="Sunday 29 November 2026, 5:30 PM · Room No. 2, Caribbean Coast Club House. Tap to RSVP.">
    <meta name="twitter:image" content="https://invite.completeautomate.com/assets/og-efb2b4.jpg">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,">
    <link rel="alternate icon" href="/favicon.ico">
    <meta name="theme-color" content="#0b4ea2">
    <style>
      :root{
        --blue:#0b4ea2;
        --blue-dark:#073a7d;
        --sky:#4fc3f7;
        --sky-light:#bfe9ff;
        --red:#e63329;
        --yellow:#ffc72c;
        --cream:#fffaf0;
        --ink:#0d2c57;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
        font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
        color:var(--ink);
        background:
          radial-gradient(circle at 15% 8%, #e8f8ff 0%, #b3e5ff 35%, #6cc9f5 70%, #38a9e6 100%);
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:26px 16px 40px;
        overflow-x:hidden;
        position:relative;
      }
    
      /* floating paw prints in the background */
      .bg-paws{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
      .bg-paws svg{
        position:absolute;
        fill:#ffffff;
        opacity:.22;
        animation:float 14s ease-in-out infinite;
      }
      .bg-paws svg:nth-child(1){width:70px;top:8%;left:6%;animation-delay:0s;transform:rotate(-18deg);}
      .bg-paws svg:nth-child(2){width:46px;top:22%;right:9%;animation-delay:2s;transform:rotate(24deg);}
      .bg-paws svg:nth-child(3){width:88px;bottom:10%;left:12%;animation-delay:4s;transform:rotate(12deg);}
      .bg-paws svg:nth-child(4){width:54px;bottom:20%;right:14%;animation-delay:1s;transform:rotate(-30deg);}
      .bg-paws svg:nth-child(5){width:38px;top:52%;left:4%;animation-delay:3s;transform:rotate(40deg);}
      .bg-paws svg:nth-child(6){width:62px;top:70%;right:4%;animation-delay:5s;transform:rotate(-8deg);}
      @keyframes float{
        0%,100%{transform:translateY(0) rotate(0deg);}
        50%{transform:translateY(-18px) rotate(6deg);}
      }
    
      .card{
        position:relative;
        z-index:1;
        width:100%;
        max-width:600px;
        background:var(--cream);
        border-radius:32px;
        padding:34px 30px 30px;
        box-shadow:
          0 24px 60px rgba(4,40,88,.35),
          0 0 0 10px rgba(255,255,255,.55),
          0 0 0 18px rgba(11,78,162,.16);
        text-align:center;
        animation:pop .55s cubic-bezier(.2,.9,.3,1.4) both;
      }
      @keyframes pop{
        from{opacity:0;transform:scale(.94) translateY(14px);}
        to{opacity:1;transform:scale(1) translateY(0);}
      }
    
      /* ── top badge ───────────────────────────────── */
      .badge-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
      .shield{width:52px;height:58px;flex:0 0 auto;}
    
      .eyebrow{
        font-size:12px;
        letter-spacing:.28em;
        text-transform:uppercase;
        font-weight:700;
        color:var(--red);
        margin:0 0 2px;
      }
      h1{
        margin:0;
        font-family:"Impact","Arial Black","Trebuchet MS",sans-serif;
        font-size:clamp(34px,10vw,52px);
        line-height:.95;
        letter-spacing:.02em;
        color:var(--blue);
        text-shadow:3px 3px 0 #ffffff, 6px 6px 0 rgba(11,78,162,.18);
      }
      .h1-sub{
        display:inline-block;
        margin-top:8px;
        font-family:"Trebuchet MS",sans-serif;
        font-size:clamp(15px,4.2vw,19px);
        font-weight:700;
        letter-spacing:.12em;
        text-transform:uppercase;
        color:#ffffff;
        background:var(--red);
        padding:7px 18px;
        border-radius:999px;
        box-shadow:0 4px 12px rgba(11,78,162,.28), inset 0 -2px 0 rgba(0,0,0,.14);
      }
    
      /* ── countdown ───────────────────────────────── */
      .countdown{
        display:inline-block;
        margin:14px auto 0;
        padding:9px 20px;
        border-radius:999px;
        background:#eaf7ff;
        border:2px dashed var(--sky);
        color:var(--blue);
        font-size:13.5px;
        font-weight:800;
        letter-spacing:.03em;
      }
      .countdown[hidden]{display:none;}
      .countdown strong{color:var(--red);}
    
      .tagline{
        margin:20px auto 4px;
        max-width:420px;
        font-style:italic;
        font-size:15px;
        line-height:1.5;
        color:#3a5b8c;
      }
    
      .paw-divider{
        display:flex;align-items:center;justify-content:center;gap:10px;
        margin:20px 0 22px;
      }
      .paw-divider .line{height:3px;flex:1;max-width:120px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--sky));}
      .paw-divider .line.right{background:linear-gradient(90deg,var(--sky),transparent);}
      .paw-divider svg{width:30px;fill:var(--blue);opacity:.85;}
    
      /* ── details ─────────────────────────────────── */
      .details{
        display:grid;
        gap:12px;
        text-align:left;
        margin:0 auto;
        max-width:440px;
      }
      .detail{
        display:flex;
        align-items:center;
        gap:14px;
        background:#ffffff;
        border:3px solid var(--sky-light);
        border-radius:18px;
        padding:13px 16px;
        box-shadow:0 4px 0 rgba(79,195,247,.28);
      }
      .detail .ico{
        flex:0 0 auto;
        width:44px;height:44px;
        display:grid;place-items:center;
        border-radius:14px;
        background:var(--blue);
        font-size:21px;
        box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
      }
      .detail .txt{line-height:1.25;}
      .detail .label{
        display:block;
        font-size:10.5px;
        letter-spacing:.16em;
        text-transform:uppercase;
        font-weight:700;
        color:#7b93b5;
        margin-bottom:2px;
      }
      .detail .value{
        font-size:16.5px;
        font-weight:700;
        color:var(--ink);
      }
      .detail .value small{font-weight:600;color:#5a7397;font-size:13.5px;}
    
      /* Tap targets: keep the text tight but give the whole link a 44px thumb area.
         Padding grows the hit box; the negative margin stops it shifting layout.
         The dashed rule moves to text-decoration so it hugs the words, not the box. */
      a.rsvp, a.map-link{
        display:inline-block;
        padding:12px 2px;
        margin:-12px 0;
        color:var(--blue);
        text-decoration:underline;
        text-decoration-style:dashed;
        text-decoration-color:var(--sky);
        text-decoration-thickness:2px;
        text-underline-offset:4px;
      }
      a.rsvp:hover, a.map-link:hover{
        color:var(--red);
        text-decoration-color:var(--red);
      }
      .detail .sub{
        display:block;
        margin-top:3px;
        font-size:11.5px;
        font-weight:600;
        color:#7b93b5;
        line-height:1.35;
      }
    
      /* ── add to calendar ─────────────────────────── */
      .calendar-row{
        display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
        margin:22px auto 0;
        max-width:440px;
      }
      .cal-btn{
        display:inline-flex;align-items:center;gap:7px;
        min-height:44px;
        padding:0 20px;
        border-radius:999px;
        background:#ffffff;
        border:2px solid var(--sky-light);
        color:var(--blue);
        font-family:inherit;
        font-size:13.5px;font-weight:700;
        text-decoration:none;cursor:pointer;
        box-shadow:0 3px 10px rgba(11,78,162,.10);
        transition:transform .1s ease,box-shadow .15s ease,background .15s ease;
      }
      .cal-btn:hover{background:#f2fbff;transform:translateY(-1px);box-shadow:0 5px 14px rgba(11,78,162,.16);}
      .cal-btn:active{transform:translateY(0);}
    
      /* ── call to action ──────────────────────────── */
      .cta{
        display:inline-flex;
        align-items:center;
        gap:10px;
        margin-top:26px;
        padding:15px 30px;
        background:linear-gradient(180deg,#ffd85e,var(--yellow));
        color:#5a3b00;
        font-weight:800;
        font-size:16px;
        letter-spacing:.06em;
        text-transform:uppercase;
        text-decoration:none;
        border-radius:999px;
        border:0;
        box-shadow:0 5px 16px rgba(217,155,0,.4), inset 0 -2px 0 rgba(190,130,0,.22);
        transition:transform .12s ease, box-shadow .12s ease;
      }
      .cta:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(217,155,0,.48), inset 0 -2px 0 rgba(190,130,0,.22);}
      .cta:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(217,155,0,.42), inset 0 -2px 0 rgba(190,130,0,.22);}
    
      /* WhatsApp glyph sits inline with the button label */
      .wa-ico{
        width:1.25em;height:1.25em;
        flex:0 0 auto;
        fill:currentColor;
        vertical-align:-0.22em;
      }
    
      /* ── RSVP headcount box ──────────────────────── */
      .rsvp-box{
        margin:26px auto 0;
        max-width:440px;
        background:#ffffff;
        border:3px solid var(--sky-light);
        border-radius:22px;
        padding:20px 18px 20px;
        box-shadow:0 4px 0 rgba(79,195,247,.28);
        text-align:left;
      }
      .rsvp-title{
        margin:0 0 3px;
        font-size:16.5px;font-weight:800;color:var(--blue);
      }
      .rsvp-sub{
        margin:0 0 14px;
        font-size:12.5px;color:#7b93b5;line-height:1.45;
      }
      .stepper{
        display:flex;align-items:center;justify-content:space-between;
        padding:10px 0;
        border-top:2px dashed #e5f2fb;
      }
      .stepper:first-of-type{border-top:0;padding-top:2px;}
      .stepper-label{font-size:15px;font-weight:700;color:var(--ink);}
      .stepper-ctrl{display:flex;align-items:center;gap:13px;}
      .stepper-ctrl button{
        width:44px;height:44px;border-radius:50%;
        border:0;background:var(--blue);color:#fff;
        font-size:22px;font-weight:700;line-height:1;cursor:pointer;
        box-shadow:0 3px 8px rgba(11,78,162,.32), inset 0 -2px 0 rgba(0,0,0,.16);
        transition:transform .1s ease,background .15s ease,box-shadow .15s ease;
      }
      .stepper-ctrl button:hover{background:var(--red);box-shadow:0 4px 10px rgba(230,51,41,.36), inset 0 -2px 0 rgba(0,0,0,.16);}
      .stepper-ctrl button:active{transform:translateY(1px);box-shadow:0 2px 5px rgba(11,78,162,.3), inset 0 -2px 0 rgba(0,0,0,.2);}
      .stepper-ctrl button:disabled{background:#c3d6e8;box-shadow:none;cursor:not-allowed;}
      .stepper-ctrl .count{
        min-width:26px;text-align:center;
        font-size:19px;font-weight:800;color:var(--blue);
        font-variant-numeric:tabular-nums;
      }
      .rsvp-total{
        margin:12px 0 0;
        font-size:13px;font-weight:700;color:#3a5b8c;
      }
      .rsvp-box .cta{display:flex;width:100%;justify-content:center;margin-top:16px;}
      .cta-no{
        display:block;
        /* 15px of text + padding = a ~44px thumb target; the negative margins
           cancel the extra box so surrounding layout doesn't move. */
        padding:14px 10px;
        margin:-1px auto -14px;
        width:max-content;
        font-size:12.5px;font-weight:700;color:#8aa2bf;
        text-decoration:underline;
        text-decoration-style:dashed;
        text-decoration-color:#cbdcec;
        text-decoration-thickness:2px;
        text-underline-offset:4px;
      }
      .cta-no:hover{color:var(--red);text-decoration-color:var(--red);}
    
      .footnote{
        margin-top:22px;
        font-size:12.5px;
        color:#7b93b5;
        line-height:1.6;
      }
      .footnote strong{color:var(--blue);}
    
      /* ── video hero ──────────────────────────────── */
      .video-hero{
        position:relative;
        width:min(300px,80%);
        margin:0 auto 22px;
        border-radius:22px;
        overflow:hidden;
        aspect-ratio:416/640;
        background:#0b4ea2;
        border:5px solid #ffffff;
        box-shadow:0 14px 34px rgba(4,40,88,.32), 0 0 0 3px rgba(11,78,162,.16);
      }
      .video-hero video{display:block;width:100%;height:100%;object-fit:cover;}
      .sound-btn{
        position:absolute;right:8px;top:8px;
        width:44px;height:44px;
        display:grid;place-items:center;
        border:0;border-radius:50%;
        background:rgba(11,78,162,.8);
        color:#fff;font-size:19px;line-height:1;cursor:pointer;
        backdrop-filter:blur(4px);
        transition:background .15s ease,transform .12s ease;
        z-index:2;
      }
      .sound-btn:hover{background:rgba(230,51,41,.92);transform:scale(1.06);}
    
      .sound-hint{
        position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
        display:inline-flex;align-items:center;gap:6px;
        min-height:44px;
        padding:0 20px;
        border:2px solid rgba(255,255,255,.9);
        border-radius:999px;
        background:rgba(11,78,162,.88);
        color:#fff;font-size:13px;font-weight:700;
        letter-spacing:.04em;white-space:nowrap;
        cursor:pointer;z-index:2;
        backdrop-filter:blur(4px);
        animation:pulseHint 2.2s ease-in-out infinite;
      }
      .sound-hint:hover{background:rgba(230,51,41,.95);}
      .sound-hint[hidden]{display:none;}
      @keyframes pulseHint{
        0%,100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 0 rgba(255,199,44,.6);}
        50%{transform:translateX(-50%) scale(1.045);box-shadow:0 0 0 12px rgba(255,199,44,0);}
      }
    
      @media (max-width:420px){
        .card{padding:26px 18px 24px;border-radius:26px;}
        .detail{padding:11px 13px;gap:11px;}
        .detail .ico{width:38px;height:38px;font-size:18px;border-radius:12px;}
        .detail .value{font-size:15px;}
      }
    </style>
    </head>
    <body>
    
    <div class="bg-paws" aria-hidden="true">
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
      <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
    </div>
    
    <main class="card">
      <div class="video-hero">
        <video id="inviteVideo" src="invite-b033ba.mp4" poster="/assets/poster-185ca8.jpg" loop muted playsinline preload="auto"
               aria-label="Animated Paw Patrol birthday invitation for Krishiv"></video>
        <button class="sound-btn" id="soundBtn" type="button" aria-label="Turn sound on" title="Toggle sound">&#128263;</button>
        <button class="sound-hint" id="soundHint" type="button">&#128266; Tap for sound</button>
      </div>
    
      <div class="badge-row">
        <svg class="shield" viewBox="0 0 100 112" aria-hidden="true">
          <path d="M50 2 96 18v40c0 26-19 44-46 52C23 102 4 84 4 58V18L50 2Z" fill="#0b4ea2"/>
          <path d="M50 10 88 23v35c0 22-16 37-38 44C28 95 12 80 12 58V23L50 10Z" fill="#4fc3f7"/>
          <ellipse cx="50" cy="72" rx="17" ry="14" fill="#fffaf0"/>
          <ellipse cx="31" cy="54" rx="7.5" ry="9.5" fill="#fffaf0"/>
          <ellipse cx="45" cy="43" rx="7.5" ry="10" fill="#fffaf0"/>
          <ellipse cx="59" cy="43" rx="7.5" ry="10" fill="#fffaf0"/>
          <ellipse cx="72" cy="54" rx="7.5" ry="9.5" fill="#fffaf0"/>
        </svg>
        <div>
          <p class="eyebrow">Paw Patrol Party</p>
          <h1>KRISHIV<br>IS FOUR!</h1>
        </div>
      </div>
    
      <span class="h1-sub">🎉 You're Invited!</span>
    
      <p class="countdown" id="countdown" hidden>🐾 <strong id="cdNum">0</strong> days to go!</p>
    
      <p class="tagline">“No job is too big, no pup is too small!”<br>
      Come help us celebrate Krishiv's <strong>4th birthday</strong> — pups, cake and big rescue missions await.</p>
    
      <div class="paw-divider" aria-hidden="true">
        <span class="line"></span>
        <svg viewBox="0 0 100 100"><ellipse cx="50" cy="68" rx="26" ry="21"/><ellipse cx="20" cy="42" rx="11" ry="14"/><ellipse cx="41" cy="24" rx="11" ry="15"/><ellipse cx="61" cy="24" rx="11" ry="15"/><ellipse cx="82" cy="42" rx="11" ry="14"/></svg>
        <span class="line right"></span>
      </div>
    
      <div class="details">
        <div class="detail">
          <div class="ico" aria-hidden="true">📅</div>
          <div class="txt">
            <span class="label">Date</span>
            <span class="value">Sunday, 29 November 2026</span>
          </div>
        </div>
    
        <div class="detail">
          <div class="ico" aria-hidden="true">⏰</div>
          <div class="txt">
            <span class="label">Time</span>
            <span class="value">5:30 PM</span>
          </div>
        </div>
    
        <div class="detail">
          <div class="ico" aria-hidden="true">📍</div>
          <div class="txt">
            <span class="label">Venue</span>
            <span class="value">
              <a class="map-link" href="https://share.google/2aPSUvq0AZUpPrlm6" target="_blank" rel="noopener">Room No. 2, Caribbean Coast Club House&nbsp;↗</a>
            </span>
            <span class="sub">Caribbean Coast Phase 1 · Monterey Cove</span>
          </div>
        </div>
    
        <div class="detail">
          <div class="ico" aria-hidden="true">📞</div>
          <div class="txt">
            <span class="label">RSVP</span>
            <span class="value"><a class="rsvp" href="tel:+85263523532">+852 6352 3532</a></span>
          </div>
        </div>
      </div>
    
      <div class="calendar-row">
        <a class="cal-btn" id="calGoogle" href="https://calendar.google.com/calendar/render?action=TEMPLATE" target="_blank" rel="noopener">
          <span aria-hidden="true">📅</span> Google Calendar
        </a>
        <button class="cal-btn" id="calIcs" type="button">
          <span aria-hidden="true">📥</span> Apple / Outlook
        </button>
      </div>
    
      <section class="rsvp-box">
        <h2 class="rsvp-title">Who's coming? 🐾</h2>
        <p class="rsvp-sub">Set your headcount, then send it to us on WhatsApp — takes 5 seconds.</p>
    
        <div class="stepper">
          <span class="stepper-label">Adults</span>
          <div class="stepper-ctrl">
            <button type="button" id="adultsMinus" aria-label="One fewer adult">−</button>
            <span class="count" id="adultsCount">2</span>
            <button type="button" id="adultsPlus" aria-label="One more adult">+</button>
          </div>
        </div>
    
        <div class="stepper">
          <span class="stepper-label">Children</span>
          <div class="stepper-ctrl">
            <button type="button" id="childrenMinus" aria-label="One fewer child">−</button>
            <span class="count" id="childrenCount">1</span>
