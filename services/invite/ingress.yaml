apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invite
  namespace: invite
spec:
  ingressClassName: traefik
  rules:
  - host: invite.completeautomate.com
    http:
      paths:
      - backend:
          service:
            name: invite
            port:
              number: 80
        path: /
        pathType: Prefix
