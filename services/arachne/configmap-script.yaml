apiVersion: v1
kind: ConfigMap
metadata:
  name: arachne-scripts
  namespace: arachne
data:
  tunnel_sync.py: |
    #!/usr/bin/env python3
    """arachne: Reconcile k3s ingresses with Cloudflare tunnel ingress rules."""

    import argparse
    import json
    import logging
    import os
    import subprocess
    import sys
    from typing import Any

    import requests

    log = logging.getLogger("arachne")

    CLOUDFLARE_API_BASE = "https://api.cloudflare.com/client/v4"
    DEFAULT_TUNNEL_ID = "011a9625-236e-42dc-b716-e5de75390eaa"
    DEFAULT_ACCOUNT_ID = "3fffdd2b812bcd8b1ee70fb599de63b7"
    DEFAULT_BACKEND = "http://192.168.128.200"
    INGRESS_HOST_SUFFIX = ".completeautomate.com"

    def load_config() -> dict:
        return {
            "api_token": os.environ["CLOUDFLARE_API_TOKEN"],
            "account_id": os.environ.get("CF_ACCOUNT_ID", DEFAULT_ACCOUNT_ID),
            "tunnel_id": os.environ.get("CF_TUNNEL_ID", DEFAULT_TUNNEL_ID),
            "backend": os.environ.get("TUNNEL_BACKEND", DEFAULT_BACKEND),
            "host_suffix": os.environ.get("HOST_SUFFIX", INGRESS_HOST_SUFFIX),
        }

    def _cf_headers(token: str) -> dict:
        return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def get_tunnel_config(cfg: dict) -> dict:
        url = f"{CLOUDFLARE_API_BASE}/accounts/{cfg['account_id']}/cfd_tunnel/{cfg['tunnel_id']}/configurations"
        resp = requests.get(url, headers=_cf_headers(cfg["api_token"]), timeout=30)
        resp.raise_for_status()
        data = resp.json()
        if not data.get("success"):
            raise RuntimeError(f"Cloudflare API error: {data.get('errors', 'unknown')}")
        return data["result"]

    def put_tunnel_config(cfg: dict, ingress: list[dict], version: int) -> dict:
        url = f"{CLOUDFLARE_API_BASE}/accounts/{cfg['account_id']}/cfd_tunnel/{cfg['tunnel_id']}/configurations"
        body = {"config": {"ingress": ingress, "warp-routing": {"enabled": False}}}
        resp = requests.put(url, headers=_cf_headers(cfg["api_token"]), json=body, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        if not data.get("success"):
            raise RuntimeError(f"Cloudflare API error: {data.get('errors', 'unknown')}")
        return data["result"]

    def get_k3s_ingress_hostnames(suffix: str = INGRESS_HOST_SUFFIX) -> set[str]:
        result = subprocess.run(
            ["kubectl", "get", "ingress", "-A", "-o", "json"],
            capture_output=True, text=True, timeout=30,
        )
        if result.returncode != 0:
            raise RuntimeError(f"kubectl failed: {result.stderr.strip()}")
        data = json.loads(result.stdout)
        hostnames: set[str] = set()
        for item in data.get("items", []):
            for rule in item.get("spec", {}).get("rules", []):
                host = rule.get("host", "")
                if host.endswith(suffix):
                    hostnames.add(host)
        return hostnames

    def reconcile(cfg: dict, *, dry_run: bool = False, verbose: bool = False) -> dict[str, Any]:
        tunnel = get_tunnel_config(cfg)
        current_ingress: list[dict] = tunnel["config"]["ingress"]
        current_version: int = tunnel["version"]
        tunnel_hostnames = {r.get("hostname", "") for r in current_ingress if r.get("hostname")}
        k3s_hostnames = get_k3s_ingress_hostnames(cfg["host_suffix"])
        missing = sorted(k3s_hostnames - tunnel_hostnames)
        result: dict[str, Any] = {
            "tunnel_hostnames": sorted(tunnel_hostnames),
            "k3s_hostnames": sorted(k3s_hostnames),
            "missing": missing, "added": [], "version": current_version,
        }
        if not missing:
            log.info("All %d tunnel hostnames are up-to-date.", len(tunnel_hostnames))
            return result
        log.info("Found %d hostname(s) in k3s but missing from tunnel: %s", len(missing), ", ".join(missing))
        if dry_run:
            log.info("DRY-RUN: would add %d hostname(s).", len(missing))
            return result
        new_rules = []
        for hostname in missing:
            new_rules.append({"service": cfg["backend"], "hostname": hostname, "originRequest": {}})
            if verbose:
                log.info("  Adding: %s -> %s", hostname, cfg["backend"])
        updated_ingress = current_ingress[:-1] + new_rules + [current_ingress[-1]]
        updated = put_tunnel_config(cfg, updated_ingress, current_version)
        result["added"] = missing
        result["version"] = updated["version"]
        log.info("Tunnel config updated to version %d — added %d hostname(s)", updated["version"], len(missing))
        return result

    def setup_logging(verbose: bool) -> None:
        level = logging.DEBUG if verbose else logging.INFO
        logging.basicConfig(level=level, format="%(asctime)s [%(levelname)s] %(message)s", datefmt="%H:%M:%S")

    def parse_args(argv: list[str] | None = None) -> argparse.Namespace:
        parser = argparse.ArgumentParser(description="Sync k3s Ingress hostnames into Cloudflare tunnel ingress config.")
        parser.add_argument("--dry-run", action="store_true", help="Preview changes without applying them.")
        parser.add_argument("-v", "--verbose", action="store_true", help="Detailed logging.")
        parser.add_argument("--json", action="store_true", help="Output result as JSON.")
        return parser.parse_args(argv)

    def main(argv: list[str] | None = None) -> int:
        args = parse_args(argv)
        setup_logging(args.verbose)
        try:
            cfg = load_config()
        except KeyError as exc:
            log.error("Missing required environment variable: %s", exc)
            print(f"ERROR: Missing required environment variable: {exc}", file=sys.stderr)
            return 1
        try:
            result = reconcile(cfg, dry_run=args.dry_run, verbose=args.verbose)
        except Exception as exc:
            log.error("Reconciliation failed: %s", exc)
            print(f"ERROR: {exc}", file=sys.stderr)
            return 1
        if args.json:
            print(json.dumps(result, indent=2))
        else:
            if result["missing"]:
                print(f"Added {len(result['added'])} hostname(s) — tunnel config v{result['version']}")
                for h in result["added"]:
                    print(f"  + {h}")
            else:
                print("All up-to-date — no changes needed.")
        return 0

    if __name__ == "__main__":
        sys.exit(main())
