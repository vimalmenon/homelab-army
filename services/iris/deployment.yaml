apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris
  namespace: microservices
  labels:
    app: iris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris
  template:
    metadata:
      labels:
        app: iris
      annotations:
        rollme: "2"
    spec:
      containers:
      - name: iris
        image: ghcr.io/vimalmenon/micro-army/iris:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: DYNAMO_SVC_URL
          value: http://clio.microservices.svc.cluster.local:8000
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: email-smtp-creds
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: email-smtp-creds
              key: SMTP_PORT
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: email-smtp-creds
              key: SMTP_USER
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-smtp-creds
              key: SMTP_PASSWORD
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: email-smtp-creds
              key: SMTP_FROM
        - name: SMTP_USE_SSL
          valueFrom:
            secretKeyRef:
              name: email-smtp-creds
              key: SMTP_USE_SSL
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
