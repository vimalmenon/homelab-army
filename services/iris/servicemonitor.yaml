apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iris
  namespace: microservices
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: iris
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
  namespaceSelector:
    matchNames:
    - microservices
