apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: secrets
  labels:
    app: infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical
  template:
    metadata:
      labels:
        app: infisical
    spec:
      containers:
      - name: infisical
        image: infisical/infisical:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: infisical-secrets
              key: encryption_key
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: infisical-secrets
              key: auth_secret
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: infisical-secrets
              key: db_connection_uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: infisical-secrets
              key: redis_url
        - name: SITE_URL
          valueFrom:
            secretKeyRef:
              name: infisical-secrets
              key: site_url
        - name: AUTH_MAGIC_CODE_ENABLED
          value: "false"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
