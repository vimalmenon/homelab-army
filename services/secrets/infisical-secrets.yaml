apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aws-dynamo-creds
  namespace: microservices
spec:
  authentication:
    kubernetesAuth:
      identityId: "0aad2048-8669-46fa-803e-80f8b4bfbb77"
      serviceAccountRef:
        name: infisical-service-account
        namespace: microservices
      autoCreateServiceAccountToken: true
      secretsScope:
        projectSlug: complete-automate-hpj-t
        envSlug: prod
        secretsPath: "/"
  managedSecretReference:
    secretName: aws-dynamo-creds
    secretNamespace: microservices
    template:
      data:
        AWS_ACCESS_KEY_ID: '{{ (index . "AWS_ACCESS_KEY_ID").Value }}'
        AWS_SECRET_ACCESS_KEY: '{{ (index . "AWS_SECRET_ACCESS_KEY").Value }}'
---
