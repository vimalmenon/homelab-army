apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-exporter-script
  namespace: default
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Pi-hole v6 Prometheus exporter - handles auth + session cookies."""
    import json, os, time, http.cookiejar, urllib.request, sys
    from http.server import HTTPServer, BaseHTTPRequestHandler

    PIHOLE_URL = os.getenv("PIHOLE_URL", "http://pihole-web.default.svc.cluster.local")
    PIHOLE_PASS = os.getenv("PIHOLE_PASSWORD", "")
    INTERVAL = int(os.getenv("INTERVAL", "30"))

    cache = {"success": False, "error": "initializing"}

    def make_opener():
        cj = http.cookiejar.CookieJar()
        return urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

    def api_call(opener, endpoint, method="GET", data=None, csrf=None):
        url = f"{PIHOLE_URL}/api/{endpoint}"
        headers = {"Accept": "application/json", "Content-Type": "application/json"}
        if csrf:
            headers["X-CSRF-Token"] = csrf
        body = json.dumps(data).encode() if data else None
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with opener.open(req, timeout=5) as r:
                return json.loads(r.read()), r
        except urllib.error.HTTPError as e:
            return {"error": str(e)}, e

    def do_scrape():
        cache["success"] = False
        try:
            opener = make_opener()
            # Login
            resp, _ = api_call(opener, "auth", method="POST", data={"password": PIHOLE_PASS})
            session = resp.get("session", {})
            if not session.get("valid"):
                cache["error"] = f"auth failed: {resp}"
                return
            csrf = session.get("csrf", "")
            # Fetch stats
            stats, _ = api_call(opener, "stats/summary", csrf=csrf)
            q = stats.get("queries", {})
            clients, _ = api_call(opener, "stats/clients", csrf=csrf)
            bl, _ = api_call(opener, "dns/blocklist", csrf=csrf)
            cache["total"] = q.get("total", 0)
            cache["blocked"] = q.get("blocked", 0)
            cache["cached"] = q.get("cached", 0)
            cache["forwarded"] = q.get("forwarded", 0)
            cache["blocked_pct"] = q.get("percent_blocked", 0)
            cache["clients"] = clients.get("clients", {}).get("total", 0)
            cache["domains_blocked"] = bl.get("blocklist", {}).get("domains_blocked", 0)
            cache["success"] = True
            cache["error"] = None
        except Exception as e:
            cache["error"] = str(e)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.end_headers()
                out = cache.get("error", "")
                self.wfile.write("\n".join([
                    '# HELP pihole_dns_queries_total Total DNS queries',
                    '# TYPE pihole_dns_queries_total gauge',
                    f'pihole_dns_queries_total {cache.get("total",0)}',
                    '',
                    '# HELP pihole_dns_queries_blocked Blocked queries',
                    '# TYPE pihole_dns_queries_blocked gauge',
                    f'pihole_dns_queries_blocked {cache.get("blocked",0)}',
                    '',
                    '# HELP pihole_dns_queries_cached Cached queries',
                    '# TYPE pihole_dns_queries_cached gauge',
                    f'pihole_dns_queries_cached {cache.get("cached",0)}',
                    '',
                    '# HELP pihole_dns_queries_forwarded Forwarded queries',
                    '# TYPE pihole_dns_queries_forwarded gauge',
                    f'pihole_dns_queries_forwarded {cache.get("forwarded",0)}',
                    '',
                    '# HELP pihole_dns_queries_blocked_percent Blocked %',
                    '# TYPE pihole_dns_queries_blocked_percent gauge',
                    f'pihole_dns_queries_blocked_percent {cache.get("blocked_pct",0)}',
                    '',
                    '# HELP pihole_clients_active Active clients',
                    '# TYPE pihole_clients_active gauge',
                    f'pihole_clients_active {cache.get("clients",0)}',
                    '',
                    '# HELP pihole_domains_blocked Domains in blocklist',
                    '# TYPE pihole_domains_blocked gauge',
                    f'pihole_domains_blocked {cache.get("domains_blocked",0)}',
                    '',
                    '# HELP pihole_up Exporter healthy (1=ok, 0=error)',
                    '# TYPE pihole_up gauge',
                    f'pihole_up {1 if cache.get("success") else 0}',
                    '',
                    '# HELP pihole_scrape_error Latest error message',
                    '# TYPE pihole_scrape_error gauge',
                    f'pihole_scrape_error{{error="{cache.get("error","")}"}} 1' if cache.get("error") else '',
                ]).encode())
            else:
                self.send_response(404)
                self.end_headers()
        def log_message(self, *a): pass

    # First scrape
    do_scrape()
    # Background scraper
    import threading
    def loop():
        while True:
            time.sleep(INTERVAL)
            do_scrape()
    threading.Thread(target=loop, daemon=True).start()
    # Serve
    sys.stderr.write(f"Pi-hole exporter starting - target: {PIHOLE_URL}\n")
    sys.stderr.flush()
    HTTPServer(("0.0.0.0", 9617), Handler).serve_forever()
