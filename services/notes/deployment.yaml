apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack
  namespace: notes
  labels:
    app: bookstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstack
  template:
    metadata:
      labels:
        app: bookstack
    spec:
      containers:
      - name: bookstack
        image: lscr.io/linuxserver/bookstack:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: bookstack-secrets
              key: app_key
        - name: APP_URL
          value: "https://notes.completeautomate.com"
        - name: DB_HOST
          value: "bookstack-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "bookstack"
        - name: DB_USER
          value: "bookstack"
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: bookstack-secrets
              key: postgres_password
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bookstack-uploads
