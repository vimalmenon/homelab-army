# ============================================================================
# kube-prometheus-stack Helm values
# Chart:  kube-prometheus-stack-86.1.0
# Source: prometheus-community/kube-prometheus-stack
#
# Extracted from live cluster (monitoring namespace) on 2026-06-06.
# ArgoCD will deploy this via Helm, not Kustomize.
# ============================================================================

# -- Full name override for resources
fullnameOverride: ""

# -- Global image registry
global:
  imageRegistry: ""

# ============================================================================
# Prometheus Operator
# ============================================================================
prometheusOperator:
  enabled: true
  image:
    repository: quay.io/prometheus-operator/prometheus-operator
    tag: v0.91.0
  prometheusConfigReloader:
    image:
      repository: quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0
  resources: {}
  # -- Deny secret types the operator should not watch
  secretFieldSelector: "type!=kubernetes.io/dockercfg,type!=kubernetes.io/service-account-token,type!=helm.sh/release.v1"
  # -- TLS configuration
  tls:
    enabled: true
  # -- Kubelet service configuration
  kubeletService:
    enabled: true
    namespace: kube-system
  # -- Use endpointslice or endpoints for kubelet
  kubeletEndpoints: true
  kubeletEndpointSlice: false

# ============================================================================
# Prometheus
# ============================================================================
prometheus:
  enabled: true
  # -- Prometheus is managed by the operator; this defines the Prometheus CR
  prometheusSpec:
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.12.0-distroless
    # -- Data retention
    retention: 7d
    # -- No persistent volume (using emptyDir)
    storageSpec: {}
    # -- Resource requests
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    # -- Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s
    # -- Enable admin API (disabled for security)
    enableAdminAPI: false
    # -- WAL compression
    walCompression: true
    # -- External URL
    externalUrl: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
    # -- ServiceMonitor selector
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    # -- PodMonitor selector
    podMonitorSelector:
      matchLabels:
        release: prometheus
    # -- Rule selector
    ruleSelector:
      matchLabels:
        release: prometheus
    # -- Probe selector
    probeSelector:
      matchLabels:
        release: prometheus
    # -- Security context
    securityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    # -- Replicas
    replicas: 1

# ============================================================================
# Grafana
# ============================================================================
grafana:
  enabled: true
  # -- Grafana subchart version (grafana-12.4.1)
  image:
    repository: docker.io/grafana/grafana
    tag: 13.0.1-security-01
  # -- Admin credentials (DO NOT use actual password - use ArgoCD Vault/SealedSecret)
  admin:
    user: admin
    password: "${GRAFANA_ADMIN_PASSWORD}"  # Placeholder - set via ArgoCD/External Secrets
  # -- Grafana config from configmap prometheus-grafana
  grafana.ini:
    server:
      domain: grafana.completeautomate.com
      root_url: https://grafana.completeautomate.com
    analytics:
      check_for_updates: true
    log:
      mode: console
    paths:
      data: /var/lib/grafana/
      logs: /var/log/grafana
      plugins: /var/lib/grafana/plugins
      provisioning: /etc/grafana/provisioning
    unified_storage:
      index_path: /var/lib/grafana-search/bleve
  # -- SMTP configuration (from live env vars)
  smtp:
    enabled: true
    host: smtp.zoho.com:465
    user: hello@completeautomate.com
    password: "${GRAFANA_SMTP_PASSWORD}"  # Placeholder - set via ArgoCD/External Secrets
    fromAddress: hello@completeautomate.com
    fromName: Grafana Alerts
    skipVerify: true
  # -- Resource requests
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  # -- Service configuration
  service:
    type: ClusterIP
    port: 80
  # -- Ingress (if needed, enable here; currently ClusterIP-only)
  ingress:
    enabled: false
  # -- Sidecar for dashboard loading
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
  # -- Additional datasources (grafana provisioning format)
  # The kube-prometheus-stack chart auto-creates these via sidecar
  additionalDataSources: []
  # -- Alerting provisioning (loaded from configmap grafana-alerting-provisioning)
  alerting:
    contactpoints:
      - name: "Email to Vimal"
        receivers:
          - uid: email-to-vimal
            type: email
            settings:
              addresses: "hello@completeautomate.com"
              singleEmail: false
            disableResolveMessage: false
    policies:
      - orgId: 1
        receiver: "Email to Vimal"
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
    # -- Grafana-managed alert rules (not PrometheusRule CRDs)
    rules:
      groups:
        - folder: Cluster Alerts
          interval: 30s
          name: node-health
          orgId: 1
          rules:
            - annotations:
                description: Node {{ $labels.node }} has been NotReady for over 2 minutes.
                  Power cycle the Pi or check its power supply and network connection.
                summary: Node {{ $labels.node }} is NotReady
              condition: A
              data:
                - datasourceUid: prometheus
                  model:
                    expr: count by (node) (kube_node_status_condition{condition="Ready",status="true"}
                      == 0)
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
              execErrState: Alerting
              for: 2m
              labels:
                severity: critical
                team: homelab
              noDataState: OK
              title: Node Down
              uid: node-down
        - folder: Cluster Alerts
          interval: 30s
          name: pod-health
          orgId: 1
          rules:
            - annotations:
                description: Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
                  has been in Pending state for over 2 minutes.
                summary: Pod {{ $labels.pod }} ({{ $labels.namespace }}) stuck in Pending
                  state
              condition: A
              data:
                - datasourceUid: prometheus
                  model:
                    expr: kube_pod_status_phase{phase="Pending"} == 1
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
              execErrState: Alerting
              for: 2m
              labels:
                pod: '{{ $labels.pod }}'
                namespace: '{{ $labels.namespace }}'
                severity: warning
                team: homelab
              noDataState: OK
              title: Pod Pending for over 2 minutes
              uid: pod-pending
            - annotations:
                description: 'Container {{ $labels.container }} in pod {{ $labels.pod }}
                  (namespace: {{ $labels.namespace }}) has restarted more than 3 times
                  in 10 minutes.'
                summary: Pod {{ $labels.pod }} ({{ $labels.container }}) is crash looping
              condition: A
              data:
                - datasourceUid: prometheus
                  model:
                    expr: count(increase(kube_pod_container_status_restarts_total[5m])
                      > 3) > 0
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
              execErrState: Alerting
              for: 1m
              labels:
                severity: warning
                team: homelab
              noDataState: OK
              title: Pod Restarting Frequently
              uid: pod-crash-looping

        - folder: Cluster Alerts
          interval: 30s
          name: log-health
          orgId: 1
          rules:
            - annotations:
                description: >-
                  Pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' is
                  producing an unusually high rate of ERROR-level log entries.
                  This indicates something is going wrong in the application.


                  🔍 Common causes:
                  1. Application crash — the service is encountering an unhandled
                     exception (check the ERROR log messages for tracebacks)
                  2. External dependency down — the service can't reach its database,
                     API, or other backend (check for connection timeout / refused errors)
                  3. Bad request data — a client is sending invalid input that causes
                     validation errors


                  📋 Debug:
                    kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} | grep ERROR | tail -20
                    kubectl exec -n {{ $labels.namespace }} {{ $labels.pod }} -- curl -s localhost:PORT/health
                summary: >-
                  🔥 ERROR logs surging in {{ $labels.pod }} (ns: {{ $labels.namespace }}) —
                  more than 0.5 ERROR-level log lines/sec in the last 5 min.
              condition: A
              data:
                - datasourceUid: loki
                  model:
                    expr: sum by(namespace, pod) (rate({namespace=~"microservices|default|monitoring"} |= "ERROR" [5m])) > 0.5
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
              execErrState: Alerting
              for: 2m
              labels:
                pod: '{{ $labels.pod }}'
                namespace: '{{ $labels.namespace }}'
                severity: warning
                team: homelab
              noDataState: OK
              title: 🔥 High ERROR rate in logs
              uid: log-error-spike
            - annotations:
                description: >-
                  Pod '{{ $labels.pod }}' is returning HTTP error responses (4xx or
                  5xx status codes) at a rate above 1 per second over 5 minutes.
                  This could mean users are hitting errors or the service is
                  malfunctioning.


                  🔍 Common causes:
                  1. Client errors (4xx) — invalid requests from the frontend or
                     external clients
                  2. Server errors (5xx) — application crashes, unhandled exceptions,
                     or dependency failures
                  3. Auth failures — expired or invalid credentials/tokens being sent


                  📋 Debug:
                    kubectl logs -n microservices {{ $labels.pod }} | grep -E '"(4[0-9][0-9]|5[0-9][0-9])"' | tail -20
                summary: >-
                  🌐 HTTP 4xx/5xx error rate > 1/sec in {{ $labels.pod }} —
                  API responses indicate client or server errors.
              condition: A
              data:
                - datasourceUid: loki
                  model:
                    expr: sum by(pod) (rate({namespace="microservices"} |~ "4[0-9][0-9]|5[0-9][0-9]" [5m])) > 1
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
              execErrState: Alerting
              for: 2m
              labels:
                pod: '{{ $labels.pod }}'
                namespace: microservices
                severity: warning
                team: homelab
              noDataState: OK
              title: 🌐 High HTTP error rate in API logs
              uid: log-http-errors
            - annotations:
                description: >-
                  Loki has received no log lines from the microservices namespace
                  for over 5 minutes. This could mean the services have
                  stopped, crashed without restarting, or Promtail on that node has
                  failed.


                  🔍 Common causes:
                  1. Pod crashed — the pod was OOMKilled or hit a fatal error and
                     cannot restart (check Pending/CrashLoopBackOff states)
                  2. Node offline — the node running the pod is NotReady
                  3. Promtail failure — the log collector DaemonSet isn't running on
                     the node


                  📋 Debug:
                    kubectl get pods --all-namespaces --field-selector=status.phase!=Running
                    kubectl get pods -n loki -o wide
                    kubectl logs -n loki -l app.kubernetes.io/name=promtail --tail=5
                summary: >-
                  🔇 Zero log lines received from microservices namespace in 5+ minutes —
                  services may be down or Promtail is failing.
              condition: A
              data:
                - datasourceUid: loki
                  model:
                    expr: sum by(namespace) (rate({namespace="microservices"}[5m])) > 0
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
              execErrState: Alerting
              for: 3m
              labels:
                severity: critical
                team: homelab
              noDataState: Alerting
              title: 🔇 No logs received — namespace silent
              uid: log-flow-stopped

        - folder: Cluster Alerts
          interval: 30s
          name: backup-health
          orgId: 1
          rules:
            - annotations:
                description: >-
                  Backup job '{{ $labels.job_name }}' in namespace 'backups' has
                  failed. The homelab-backup CronJob runs daily at 3:00 AM and
                  backs up PVC data and k8s resource manifests to S3.


                  🔍 Common causes:
                  1. S3 credentials expired — check the aws-dynamo-creds ESO secret
                  2. NFS mount issue — the PVCs may not be reachable from the backup pod
                  3. Storage full — the PVC exceeded its capacity during tar


                  📋 Debug:
                    kubectl logs -n backups -l job-name={{ $labels.job_name }} --tail=50
                    kubectl describe job -n backups {{ $labels.job_name }}
                summary: >-
                  ❌ Backup job '{{ $labels.job_name }}' FAILED —
                  PVC/S3 data may not be protected. Check logs and re-run.
              condition: A
              data:
                - datasourceUid: prometheus
                  model:
                    expr: kube_job_status_failed{namespace="backups", job_name=~".*homelab-backup.*"} > 0
                    interval: 30s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
              execErrState: Alerting
              for: 0s
              labels:
                severity: critical
                team: homelab
              noDataState: OK
              title: ❌ Backup Job Failed
              uid: backup-failed
            - annotations:
                description: >-
                  The homelab-backup CronJob has not completed successfully in
                  the last 26 hours (scheduled every 24 hours at 3:00 AM).
                  This could mean the CronJob is misconfigured, the pod is
                  stuck pending, or the cluster scheduler is not triggering it.


                  📋 Debug:
                    kubectl get cronjob -n backups homelab-backup
                    kubectl get jobs -n backups
                    kubectl describe cronjob -n backups homelab-backup
                summary: >-
                  ⏰ Backup cronjob has NOT run in 26+ hours —
                  may be stuck or misconfigured.
              condition: A
              data:
                - datasourceUid: prometheus
                  model:
                    expr: time() - kube_cronjob_status_last_schedule_time{namespace="backups", cronjob="homelab-backup"} > 93600
                    interval: 60s
                    refId: A
                  refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
              execErrState: Alerting
              for: 5m
              labels:
                severity: warning
                team: homelab
              noDataState: OK
              title: ⏰ Backup Missed — No recent backup
              uid: backup-missed

# ============================================================================
# kube-state-metrics
# ============================================================================
kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.19.0

# ============================================================================
# prometheus-node-exporter
# ============================================================================
nodeExporter:
  enabled: true
  image:
    repository: quay.io/prometheus/node-exporter
    tag: v1.11.1

# ============================================================================
# Alertmanager
# ============================================================================
alertmanager:
  enabled: false  # Not deployed; Grafana handles alerting

# ============================================================================
# Default rules (from prometheus-community/kube-prometheus-stack)
# The chart includes ~35 PrometheusRule CRDs by default (kubernetes mixin rules).
# These are auto-generated and managed by the chart. If custom rules are
# needed beyond Grafana-managed alerting, add them via additionalPrometheusRules.
# ============================================================================
defaultRules:
  enabled: true
  create: true
  rules:
    alertmanager: true
    configReloaders: true
    etcd: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryMajorPageFaults: true
    k8sContainerMemoryManagement: true
    k8sContainerMemoryPageFaults: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sContainerRequest: true
    k8sContainerResource: true
    k8sContainerThrottling: true
    k8sPodStatusFailed: true
    k8sPodStatusPhase: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubeScheduler: true
    kubeStateMetrics: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeVersion: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
