apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
      - name: copy-config
        image: busybox:1.36
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command:
        - sh
        - -c
        - |
          # Copy config files from ConfigMap to writable emptyDir
          for f in /app-config/*; do
            [ -f "$f" ] && cp -rL "$f" /app/config/
          done
          mkdir -p /app/config/logs
        volumeMounts:
        - name: config-templates
          mountPath: /app-config
          readOnly: true
        - name: config
          mountPath: /app/config
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "*"
        volumeMounts:
        - name: config
          mountPath: /app/config
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
      volumes:
      - name: config-templates
        configMap:
          name: homepage-config
      - name: config
        emptyDir: {}
