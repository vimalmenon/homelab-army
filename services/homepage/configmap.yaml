apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    ---
    providers:
      openweathermap: openweathermap
      weatherapi: weatherapi
  kubernetes.yaml: |
    ---
    mode: cluster
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      nodes: true
  services.yaml: |
    ---
    - Monitoring:
        - Grafana:
            href: https://grafana.completeautomate.com
            description: Cluster metrics & dashboards
            icon: grafana.png
            ping: grafana.completeautomate.com
        - Prometheus:
            href: https://prometheus.completeautomate.com
            description: Metrics collection
            icon: prometheus.png
            ping: prometheus.completeautomate.com
        - Loki:
            href: https://grafana.completeautomate.com/explore
            description: Log aggregation
            icon: loki.png
            ping: loki.loki.svc.cluster.local:3100
        - Uptime Kuma:
            href: https://uptime.completeautomate.com
            description: Uptime monitoring
            icon: uptime-kuma.png
            ping: uptime.completeautomate.com
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.completeautomate.com
            description: GitOps deployment
            icon: argocd.png
            ping: argocd.completeautomate.com
        - Traefik:
            href: https://traefik.completeautomate.com
            description: Ingress controller
            icon: traefik.png
            ping: traefik.completeautomate.com
        - NetAlertX:
            href: https://netalertx.completeautomate.com
            description: Network monitoring
            icon: netalertx.png
            ping: netalertx.completeautomate.com
    - Services:
        - n8n:
            href: https://n8n.completeautomate.com
            description: Workflow automation
            icon: n8n.png
            ping: n8n.completeautomate.com
        - Pi-hole:
            href: https://pihole.completeautomate.com/admin
            description: DNS & ad blocking
            icon: pihole.png
            ping: pihole.completeautomate.com
        - Slides:
            href: https://slides.completeautomate.com
            description: AI slides generator
            icon: slides.png
            ping: slides.completeautomate.com
    - Development:
        - GitHub:
            href: https://github.com/vimalmenon
            description: Source code
            icon: github.png
        - Cloudflare:
            href: https://dash.cloudflare.com
            description: DNS & CDN
            icon: cloudflare.png
        - AWS Console:
            href: https://console.aws.amazon.com
            description: AWS management
            icon: aws.png
  widgets.yaml: |
    ---
    - greeting:
        text_size: xl
        text:
          - Welcome to Complete Automate
    - resources:
        cpu: true
        memory: true
        disk: /
        cputemp: true
        uptime: true
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
  bookmarks.yaml: |
    ---
    - Quick Access:
        - Complete Automate:
            href: https://completeautomate.com
            icon: completeautomate.png
            description: Main website
        - YouTube Channel:
            href: "https://youtube.com/@real_vimal_menon"
            icon: youtube.png
            description: "real_vimal_menon"
        - Gmail:
            href: https://mail.google.com
            icon: gmail.png
        - Linear:
            href: https://linear.app
            icon: linear.png
