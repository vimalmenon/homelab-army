apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  kubernetes.yaml: |
    ---
    mode: cluster
  services.yaml: |
    ---
    - Monitoring:
        - Grafana:
            href: https://grafana.completeautomate.com
            description: Cluster metrics & dashboards
            ping: https://grafana.completeautomate.com
        - Prometheus:
            href: https://grafana.completeautomate.com
            description: Metrics collection
        - Loki:
            href: https://grafana.completeautomate.com/explore
            description: Log aggregation
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.completeautomate.com
            description: GitOps deployment
            ping: https://argocd.completeautomate.com
        - Traefik:
            href: https://grafana.completeautomate.com
            description: Ingress controller
        - Architecture Map:
            href: https://arch.completeautomate.com
            description: 3D system architecture viewer
            ping: https://arch.completeautomate.com
        - NetAlertX:
            href: https://netalertx.completeautomate.com
            description: Network monitoring
            ping: https://netalertx.completeautomate.com
        - Vaultwarden:
            href: https://vault.completeautomate.com
            description: Password manager
            ping: https://vault.completeautomate.com
        - Semaphore:
            href: https://ops.completeautomate.com
            description: Ansible & Terraform automation
            ping: https://ops.completeautomate.com/api/ping
    - Olympus (Services):
        - Clio:
            href: https://wiki.completeautomate.com/docs
            description: Data persistence (DynamoDB)
        - Atlas:
            href: https://wiki.completeautomate.com/docs
            description: File storage (S3)
        - Athena:
            href: https://wiki.completeautomate.com
            description: Wiki / knowledge base
            ping: https://wiki.completeautomate.com/health
        - Orpheus:
            href: https://wiki.completeautomate.com/docs
            description: YouTube video management
        - Iris:
            href: https://wiki.completeautomate.com/docs
            description: Email delivery (SMTP)
        - Angelos:
            href: https://messages.completeautomate.com/docs
            description: Contact form API
            ping: https://messages.completeautomate.com/health
    - Workflows:
        - n8n:
            href: https://n8n.completeautomate.com
            description: Workflow automation
            ping: https://n8n.completeautomate.com
        - Pi-hole:
            href: https://grafana.completeautomate.com/d/pihole-dns-dashboard/pi-hole-dns
            description: DNS & ad blocking
        - Slides:
            href: https://slides.completeautomate.com
            description: AI slides generator
            ping: https://slides.completeautomate.com
    - Development:
        - GitHub:
            href: https://github.com/vimalmenon
            description: Source code
        - Cloudflare:
            href: https://dash.cloudflare.com
            description: DNS & CDN
        - AWS Console:
            href: https://console.aws.amazon.com
            description: AWS management
        - Linear:
            href: https://linear.app/completeautomate
            description: Issue tracking
    - Communications:
        - Zoho Mail:
            href: https://mail.zoho.com/zm/#mail/folder/inbox
            description: Email inbox
    - Nodes:
        - homelab01:
            href: https://grafana.completeautomate.com/d/k3s-cluster-resources
            description: Control-plane · 192.168.128.54
            ping: 192.168.128.54
        - homelab02:
            href: https://grafana.completeautomate.com/d/k3s-cluster-resources
            description: Worker · 192.168.128.60
            ping: 192.168.128.60
        - homelab03:
            href: https://grafana.completeautomate.com/d/k3s-cluster-resources
            description: Worker, NFS · 192.168.128.59
            ping: 192.168.128.59
        - Hermes Pi:
            href: https://grafana.completeautomate.com/d/ee5218d2-51d3-471b-80a0-70bc95f6ae64/hermes-pi
            description: Host machine · 192.168.128.52
            ping: 192.168.128.52
  widgets.yaml: |
    ---
    - greeting:
        text_size: xl
        text:
          - Welcome to Complete Automate
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        cpu: true
        memory: true
        disk: /
        cputemp: true
        uptime: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
  bookmarks.yaml: |
    ---
    - Quick Access:
        - Complete Automate:
            - href: https://completeautomate.com
              description: Main website
              abbr: CA
        - YouTube Channel:
            - href: https://youtube.com/@real_vimal_menon
              description: real_vimal_menon
              abbr: YT
        - Gmail:
            - href: https://mail.google.com
              abbr: GM
        - Linear:
            - href: https://linear.app/completeautomate
              description: Issue tracking
              abbr: LI
        - Vaultwarden:
            - href: https://vault.completeautomate.com
              description: Password manager
              abbr: VW
