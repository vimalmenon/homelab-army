apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  kubernetes.yaml: |
    ---
    mode: cluster
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      nodes: true
  services.yaml: |
    ---
    - Monitoring:
        - Grafana:
            href: https://grafana.completeautomate.com
            description: Cluster metrics & dashboards
            ping: https://grafana.completeautomate.com
        - Prometheus:
            href: https://grafana.completeautomate.com
            description: Metrics collection
        - Loki:
            href: https://grafana.completeautomate.com/explore
            description: Log aggregation
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.completeautomate.com
            description: GitOps deployment
            ping: https://argocd.completeautomate.com
        - Traefik:
            href: https://grafana.completeautomate.com
            description: Ingress controller
        - NetAlertX:
            href: https://netalertx.completeautomate.com
            description: Network monitoring
            ping: https://netalertx.completeautomate.com
    - Services:
        - n8n:
            href: https://n8n.completeautomate.com
            description: Workflow automation
            ping: https://n8n.completeautomate.com
        - Pi-hole:
            href: https://grafana.completeautomate.com/d/pihole-dns-dashboard/pi-hole-dns
            description: DNS & ad blocking
        - Slides:
            href: https://slides.completeautomate.com
            description: AI slides generator
            ping: https://slides.completeautomate.com
    - Development:
        - GitHub:
            href: https://github.com/vimalmenon
            description: Source code
        - Cloudflare:
            href: https://dash.cloudflare.com
            description: DNS & CDN
        - AWS Console:
            href: https://console.aws.amazon.com
            description: AWS management
    - Communications:
        - Zoho Mail:
            href: https://mail.zoho.com/zm/#mail/folder/inbox
            description: Email inbox
  widgets.yaml: |
    ---
    - greeting:
        text_size: xl
        text:
          - Welcome to Complete Automate
    - resources:
        cpu: true
        memory: true
        disk: /
        cputemp: true
        uptime: true
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
  bookmarks.yaml: |
    ---
    - Quick Access:
        - Complete Automate:
            - href: https://completeautomate.com
              description: Main website
              abbr: CA
        - YouTube Channel:
            - href: https://youtube.com/@real_vimal_menon
              description: real_vimal_menon
              abbr: YT
        - Gmail:
            - href: https://mail.google.com
              abbr: GM
        - Linear:
            - href: https://linear.app
              abbr: LI
