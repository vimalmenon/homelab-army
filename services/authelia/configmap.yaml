apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    ###############################################################
    #                   Authelia configuration                    #
    ###############################################################
    host: 0.0.0.0
    port: 9091
    log_level: debug
    jwt_secret: REPLACED_BY_ENV_VAR_jwt_secret
    theme: dark
    identity_providers:
      oidc:
        hmac_secret: REPLACED_BY_ENV_VAR_oidc_hmac_secret
        issuer_private_key: |
          ---
          REPLACED_BY_ENV_VAR_oidc_issuer_private_key
        cors:
          endpoints:
            - authorization
            - token
            - revocation
            - end_session
          allowed_origins:
            - https://n8n.completeautomate.com
          allowed_origins_from_client_redirect_uris: false
        access_token_lifespan: 1h
        authorize_code_lifespan: 5m
        id_token_lifespan: 30m
        refresh_token_lifespan: 90m
        enable_client_debug_messages: false
        clients: []
    log:
      format: json
    totp:
      issuer: auth.completeautomate.com
      period: 30
      skew: 1
    authentication_backend:
      file:
        path: /config/users.yml
      password_reset:
        disable: false
    password_policy:
      standard:
        enabled: false
      zxcvbn:
        enabled: false
    access_control:
      default_policy: deny
      rules:
        - domain: auth.completeautomate.com
          policy: bypass
        - domain: auth.homelab.local
          policy: bypass
        - domain: n8n.homelab.local
          policy: one_factor
        - domain: n8n.completeautomate.com
          policy: one_factor
        - domain: argocd.homelab.local
          policy: one_factor
        - domain: argocd.completeautomate.com
          policy: one_factor
        - domain: admin.completeautomate.com
          policy: one_factor
        - domain: grafana.homelab.local
          policy: one_factor
        - domain: prometheus.homelab.local
          policy: one_factor
        - domain: netalertx.homelab.local
          policy: one_factor
        - domain: netalertx.completeautomate.com
          policy: one_factor
        - domain: "*.homelab.local"
          policy: bypass
        - domain: "*.completeautomate.com"
          policy: bypass
    session:
      name: authelia_session
      secret: REPLACED_BY_ENV_VAR_session_secret
      expiration: 8h
      inactivity: 45m
      remember_me: 30d
      cookies:
        - name: authelia_session
          domain: completeautomate.com
          authelia_url: https://auth.completeautomate.com
          default_redirection_url: https://n8n.completeautomate.com
        - name: authelia_session
          domain: homelab.local
          authelia_url: https://auth.homelab.local
          default_redirection_url: https://n8n.homelab.local
    regulation:
      max_retries: 5
      find_time: 2m
      ban_time: 5m
    storage:
      local:
        path: /config/db.sqlite3
    notifier:
      filesystem:
        filename: /config/notifications.yml
