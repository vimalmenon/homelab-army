apiVersion: v1
kind: ServiceAccount
metadata:
  name: hestia
  namespace: microservices
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hestia-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hestia-node-reader
subjects:
  - kind: ServiceAccount
    name: hestia
    namespace: microservices
roleRef:
  kind: ClusterRole
  name: hestia-node-reader
  apiGroup: rbac.authorization.k8s.io
