apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

commonLabels:
  grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-k3s-cluster
    files:
      - k3s-cluster-resources.json
  - name: dashboard-atlas
    files:
      - atlas.json
  - name: dashboard-iris
    files:
      - iris.json
  - name: dashboard-pihole-dns
    files:
      - pihole.json
